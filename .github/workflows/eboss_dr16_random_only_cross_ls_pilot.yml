name: eBOSS DR16 SGC mock0001 random-only cross-LS pilot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eboss_dr16_random_only_cross_ls_pilot.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pinned-random-only-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FITS and independent scalar pair-check dependencies
        run: python -m pip install 'numpy>=1.24' 'scipy>=1.10' 'astropy>=5.3'
      - name: Independently validate all four cross-LS terms synthetically
        run: python scripts/audit_eboss_dr16_random_only_cross_ls_pilot.py --self-test
      - name: Download fixed verified nine-mock source SHA manifest
        run: |
          gh run download 36017670812 --repo "$GITHUB_REPOSITORY" \
            --name eboss-dr16-nine-mock-window-ensemble --dir source
          test -s source/ninemock_window_ensemble.json
      - name: Run pinned observed/random and mock0001/random SGC oriented cross-LS pilot
        run: |
          mkdir -p eboss_workspace/local_pair_window
          python scripts/audit_eboss_dr16_random_only_cross_ls_pilot.py \
            --ensemble-json source/ninemock_window_ensemble.json \
            --cap SGC --mock-id 1 \
            --use-committed-first-mock-counts \
            --observed-cache-dir eboss_workspace/local_rr/fits \
            --mock-cache-dir eboss_workspace/local_pair_window/mock_fits \
            --out-dir eboss_workspace/local_pair_window \
            --timeout 125
      - name: Preserve random-only pair closure result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eboss-dr16-sgc-mock0001-random-only-cross-ls
          path: eboss_workspace/local_pair_window/random_only_cross_ls_pilot.json
          if-no-files-found: warn
          retention-days: 90
