name: eBOSS DR16 all-bin conditional RR window

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_eboss_dr16_conditional_window_allbins.py'
      - '.github/workflows/eboss_dr16_conditional_window_allbins.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'eBOSS DR16 all-bin fine-RR geometric closure'
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  synthetic-operator:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install 'numpy>=1.24'
      - name: Check all-bin constant closure and signed-mu parity
        run: python scripts/build_eboss_dr16_conditional_window_allbins.py --self-test

  from-allbin-fine-artifact:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_WORKFLOW_RUN: ${{ github.event.workflow_run.id }}
      SOURCE_WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install 'numpy>=1.24'
      - name: Check operator algebra independently
        run: python scripts/build_eboss_dr16_conditional_window_allbins.py --self-test
      - name: Retrieve only successful all-bin fine RR artifact
        run: |
          gh run download "$SOURCE_WORKFLOW_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name eboss-dr16-fine-rr-allbins \
            --dir allbin_fine_input
          test -s allbin_fine_input/fine_rr_allbins_audit.json
          test -s allbin_fine_input/fine_rr_allbins_audit.npz
      - name: Build all eight blinded conditional finite-bin responses
        run: |
          python scripts/build_eboss_dr16_conditional_window_allbins.py \
            --fine-rr allbin_fine_input/fine_rr_allbins_audit.npz \
            --fine-audit allbin_fine_input/fine_rr_allbins_audit.json \
            --out eboss_workspace/allbin_conditional_window.json
      - name: Retain all-bin response matrices and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eboss-dr16-allbin-conditional-window
          path: |
            eboss_workspace/allbin_conditional_window.json
            eboss_workspace/allbin_conditional_window.npz
          if-no-files-found: warn
