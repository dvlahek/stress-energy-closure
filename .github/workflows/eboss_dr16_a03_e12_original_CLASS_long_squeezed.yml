name: eBOSS DR16 A03E12 pinned CLASS long CDM relative-wind squeezed source only
on:
  push:
    branches:
      - audit/eboss-elg-bit8-ra-orientation-20260925
    paths:
      - 'scripts/audit_eboss_dr16_a03_e12_original_CLASS_long_density_wind_bispectrum.py'
      - 'source_data/eboss_dr16_a03_e12_squeezed_long_CLASS_transfer_prereg_2026-09-27.json'
      - '.github/workflows/eboss_dr16_a03_e12_original_CLASS_long_squeezed.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pinned-original-three-source-only-CLASS:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original numerical environment
        run: python -m pip install --upgrade pip setuptools wheel 'numpy>=1.24,<2.4' scipy cython
      - name: Download only immutable completed original E8 E9 E11 CI sources, no survey catalogues or mocks
        run: |
          mkdir -p eboss_workspace/a03_e12_orig_E8 eboss_workspace/a03_e12_orig_E9 eboss_workspace/a03_e12_orig_E11
          gh run download 36307484339 --repo dvlahek/stress-energy-closure --name eboss-a03-e8-frozen-source-only-kinetic-and-conditional-resonance --dir eboss_workspace/a03_e12_orig_E8
          gh run download 36325438404 --repo dvlahek/stress-energy-closure --name eboss-a03-e9-frozen-three-state-class-conditional-phase --dir eboss_workspace/a03_e12_orig_E9
          gh run download 36329666591 --repo dvlahek/stress-energy-closure --name eboss-a03-e11-frozen-Gaussian-Wick-squeezed-response-source-only --dir eboss_workspace/a03_e12_orig_E11
          echo 'bf8f48deb9514c5101d5ce314bfbd397485102a5487da1039f141e3cad6143d0  eboss_workspace/a03_e12_orig_E8/frozen_matched_distributions_4000q.csv' | sha256sum --check
          echo '450b35f68a329f545f21bbe7ec02e36941e4c303037ccb7c011830c315d15890  eboss_workspace/a03_e12_orig_E9/quasistatic_alpha_dln_a_source_only_plus_CLASS.json' | sha256sum --check
          echo 'fffdd6fac67256631e5981182e1b8ba6f48eb05ad14ddbec48e6d8eaa98b45eb  eboss_workspace/a03_e12_orig_E11/a03_e11_gaussian_wind_squeezed_response.json' | sha256sum --check
      - name: Fetch pinned ORIGINAL CLASS commit
        run: |
          git init class_public
          git -C class_public remote add origin https://github.com/lesgourg/class_public.git
          git -C class_public fetch --depth 1 origin e85808324f51fc694d12e3ed7439552a3c3f9540
          git -C class_public checkout --detach FETCH_HEAD
          test "$(git -C class_public rev-parse HEAD)" = "e85808324f51fc694d12e3ed7439552a3c3f9540"
      - name: Install pinned original CLASS Python interface
        run: python -m pip install ./class_public
      - name: Independently evolve original FD Fplus Fminus CLASS long-wave transfers in separate processes
        run: |
          python -m py_compile scripts/audit_eboss_dr16_a03_e12_original_CLASS_long_density_wind_bispectrum.py
          for state in FD plus minus; do
            python -u scripts/audit_eboss_dr16_a03_e12_original_CLASS_long_density_wind_bispectrum.py --state "$state" \
              --e8-csv eboss_workspace/a03_e12_orig_E8/frozen_matched_distributions_4000q.csv \
              --e9-json eboss_workspace/a03_e12_orig_E9/quasistatic_alpha_dln_a_source_only_plus_CLASS.json \
              --e11-json eboss_workspace/a03_e12_orig_E11/a03_e11_gaussian_wind_squeezed_response.json \
              --outdir eboss_workspace/a03_e12_CLASS_long_squeezed
          done
      - name: Freeze genuine predeclared long-K x original short-k squeezed Gamma-C source-only kernels
        run: |
          python -u scripts/audit_eboss_dr16_a03_e12_original_CLASS_long_density_wind_bispectrum.py --aggregate \
            --e8-csv eboss_workspace/a03_e12_orig_E8/frozen_matched_distributions_4000q.csv \
            --e9-json eboss_workspace/a03_e12_orig_E9/quasistatic_alpha_dln_a_source_only_plus_CLASS.json \
            --e11-json eboss_workspace/a03_e12_orig_E11/a03_e11_gaussian_wind_squeezed_response.json \
            --outdir eboss_workspace/a03_e12_CLASS_long_squeezed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eboss-a03-e12-original-CLASS-long-Cdm-wind-squeezed-source-only
          if-no-files-found: warn
          retention-days: 30
          path: |
            eboss_workspace/a03_e12_CLASS_long_squeezed/e12_long_density_velocity_FD.json
            eboss_workspace/a03_e12_CLASS_long_squeezed/e12_long_density_velocity_plus.json
            eboss_workspace/a03_e12_CLASS_long_squeezed/e12_long_density_velocity_minus.json
            eboss_workspace/a03_e12_CLASS_long_squeezed/e12_CLASS_long_density_wind_squeezed_gamma_source_only.json
