name: Wake transfer probe

on:
  push:
    branches: [fullshape-wake-upgrade]
    paths:
      - 'code/wake_transfer_probe.py'
      - '.github/workflows/wake_transfer_probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip setuptools wheel numpy scipy cython
      - name: Fetch pinned CLASS
        run: |
          git init class_public
          git -C class_public remote add origin https://github.com/lesgourg/class_public.git
          git -C class_public fetch --depth 1 origin e85808324f51fc694d12e3ed7439552a3c3f9540
          git -C class_public checkout --detach FETCH_HEAD
      - name: Install CLASS
        run: python -m pip install ./class_public
      - name: Probe transfer output
        run: python code/wake_transfer_probe.py | tee transfer_probe.log
      - uses: actions/upload-artifact@v4
        with:
          name: wake-transfer-probe
          path: |
            wake_transfer_probe.json
            transfer_probe.log
