name: eBOSS ELG immutable raw FITS provenance synthetic test

on:
  push:
    branches:
      - audit/eboss-elg-bit8-ra-orientation-20260925
    paths:
      - 'scripts/audit_eboss_dr16_elg_full_bytes_provenance.py'
      - 'source_data/eboss_dr16_elg_full_bytes_provenance_protocol_2026-09-25.json'
      - '.github/workflows/eboss_dr16_elg_full_bytes_provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-only-no-catalogues:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify bounded raw stream/sha corruption detection without real catalogue
        run: python -u scripts/audit_eboss_dr16_elg_full_bytes_provenance.py --self-test
