name: Two-tracer parity-odd wake Fisher

on:
  push:
    branches: [fullshape-wake-upgrade]
    paths:
      - 'code/wake_two_tracer_fisher.py'
      - '.github/workflows/wake_two_tracer_fisher.yml'

jobs:
  fisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip setuptools wheel numpy scipy cython
      - name: Fetch pinned CLASS
        run: |
          git init class_public
          git -C class_public remote add origin https://github.com/lesgourg/class_public.git
          git -C class_public fetch --depth 1 origin e85808324f51fc694d12e3ed7439552a3c3f9540
          git -C class_public checkout --detach FETCH_HEAD
          test "$(git -C class_public rev-parse HEAD)" = "e85808324f51fc694d12e3ed7439552a3c3f9540"
      - name: Install CLASS
        run: python -m pip install ./class_public
      - name: Run two-tracer wake Fisher
        run: |
          python code/wake_two_tracer_fisher.py \
            --outdir wake_two_tracer_output \
            --mass 0.06 \
            --z-match 1100 \
            --frac 0.30 \
            --volume 1.0 \
            --samples 50000 \
            --validate 5 \
            --seed 20260913
      - name: Record CLASS commit
        if: always()
        run: git -C class_public rev-parse HEAD > wake_two_tracer_output/CLASS_COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wake-two-tracer-fisher
          path: wake_two_tracer_output/
          if-no-files-found: error
