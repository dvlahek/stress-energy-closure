name: Validation - halo-mass proxy scatter

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/wake_mass_proxy_scatter.py'
      - 'code/bgs_full_mass_grid.py'
      - '.github/workflows/wake_mass_proxy_scatter.yml'

jobs:
  scatter:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {sigma: '0.00', tag: 's000'}
          - {sigma: '0.10', tag: 's010'}
          - {sigma: '0.20', tag: 's020'}
          - {sigma: '0.30', tag: 's030'}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip setuptools wheel numpy scipy cython
      - name: Fetch pinned CLASS
        run: |
          git init class_public
          git -C class_public remote add origin https://github.com/lesgourg/class_public.git
          git -C class_public fetch --depth 1 origin e85808324f51fc694d12e3ed7439552a3c3f9540
          git -C class_public checkout --detach FETCH_HEAD
          test "$(git -C class_public rev-parse HEAD)" = "e85808324f51fc694d12e3ed7439552a3c3f9540"
      - name: Install CLASS
        run: python -m pip install ./class_public
      - name: Run scatter point
        run: |
          python code/wake_mass_proxy_scatter.py \
            --sigma-dex '${{ matrix.sigma }}' \
            --outdir 'wake_scatter_${{ matrix.tag }}' \
            --mass 0.06 --z-match 1100 --frac 0.30 \
            --samples 40000 --validate 3 --seed 20260913
      - name: Record CLASS commit
        run: git -C class_public rev-parse HEAD > 'wake_scatter_${{ matrix.tag }}/CLASS_COMMIT.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: wake-mass-proxy-scatter-${{ matrix.tag }}
          path: wake_scatter_${{ matrix.tag }}/
          if-no-files-found: error
