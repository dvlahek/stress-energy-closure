name: eBOSS DR16 A03E12 pinned direct CLASS vTk long-mode audit and original-byte archive
on:
  push:
    branches:
      - audit/eboss-elg-bit8-ra-orientation-20260925
    paths:
      - 'scripts/audit_eboss_dr16_a03_e12_direct_class_vTk_long_cross.py'
      - 'source_data/eboss_dr16_a03_e12_direct_CLASS_vTk_long_mode_cross_protocol_2026-09-27.json'
      - '.github/workflows/eboss_dr16_a03_e12_direct_CLASS_vTk_long_cross.yml'
permissions:
  contents: write
  actions: read
jobs:
  frozen-three-state-direct-theta:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical CLASS build dependencies only
        run: python -m pip install --upgrade pip setuptools wheel 'numpy==1.26.4' scipy cython
      - name: Test E12 original archival parents and Fourier sign algebra before CLASS
        run: |
          python -m py_compile scripts/audit_eboss_dr16_a03_e12_direct_class_vTk_long_cross.py
          python -u scripts/audit_eboss_dr16_a03_e12_direct_class_vTk_long_cross.py --self-test
      - name: Fetch original pinned CLASS source
        run: |
          git init class_public
          git -C class_public remote add origin https://github.com/lesgourg/class_public.git
          git -C class_public fetch --depth 1 origin e85808324f51fc694d12e3ed7439552a3c3f9540
          git -C class_public checkout --detach FETCH_HEAD
          test "$(git -C class_public rev-parse HEAD)" = "e85808324f51fc694d12e3ed7439552a3c3f9540"
      - name: Install original exact CLASS backend
        run: python -m pip install ./class_public
      - name: Compute F0 Fplus Fminus direct CLASS theta-vs-density proxy in isolated processes
        run: |
          for s in FD plus minus; do
            python -u scripts/audit_eboss_dr16_a03_e12_direct_class_vTk_long_cross.py \
              --state "$s" --output-dir eboss_workspace/a03_physics_source/e12_direct_vTk_long_cross
          done
      - name: Verify all three original-source direct theta records and aggregate
        run: |
          python -u scripts/audit_eboss_dr16_a03_e12_direct_class_vTk_long_cross.py \
            --aggregate --output-dir eboss_workspace/a03_physics_source/e12_direct_vTk_long_cross
      - name: Permanently commit original exact E12 JSON results to audit branch
        run: |
          set -eu
          orig=eboss_workspace/a03_physics_source/e12_direct_vTk_long_cross
          dest=source_data/eboss_dr16_a03_e12_archived_CI_2026_09_27
          mkdir -p "$dest"
          cp "$orig"/e12_direct_vTk_long_cross_FD.json "$dest/"
          cp "$orig"/e12_direct_vTk_long_cross_plus.json "$dest/"
          cp "$orig"/e12_direct_vTk_long_cross_minus.json "$dest/"
          cp "$orig"/e12_all_states_summary_source_only.json "$dest/"
          python - <<'PY'
          import hashlib,json,pathlib,os
          root=pathlib.Path("source_data/eboss_dr16_a03_e12_archived_CI_2026_09_27")
          records=[]
          for file in sorted(root.glob("*.json")):
              if file.name=="archive_manifest.json":continue
              raw=file.read_bytes()
              records.append({"file":file.name,"sha256":hashlib.sha256(raw).hexdigest(),"size_bytes":len(raw)})
          assert len(records)==4
          obj={"date":"2026-09-27","run_id":os.environ.get("GITHUB_RUN_ID"),
               "scope":"Original frozen source-only vTk vs density-proxy audit. NOT an observed eBOSS B, xi, S/N or valid product with E11 Gamma.",
               "preregistration_git_blob":"4805ce5f70d0908ccbf26ccc0a3ec5812f4ce757",
               "frozen_original_E8_csv_sha256":"bf8f48deb9514c5101d5ce314bfbd397485102a5487da1039f141e3cad6143d0",
               "frozen_original_E9_full_sha256":"450b35f68a329f545f21bbe7ec02e36941e4c303037ccb7c011830c315d15890",
               "originals_unchanged":True,"observed_odd_sealed":True,
               "files":records}
          (root/"archive_manifest.json").write_text(json.dumps(obj,indent=2)+"\n")
          for r in records:print("E12_ORIGINAL_ARCHIVE",r["file"],r["sha256"],r["size_bytes"],flush=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          if git diff --cached --quiet; then
            echo "E12_RESULTS_ALREADY_IN_GITHUB"
          else
            git commit -m "archive(E12): exact three-state direct CLASS vTk versus E9 proxy and fixed long P_delta_cb,r"
            git push origin HEAD:refs/heads/audit/eboss-elg-bit8-ra-orientation-20260925
          fi
          echo "E12_ALL_RESULTS_PERMANENTLY_COMMITTED_TO_AUDIT_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eboss-a03-e12-three-state-direct-CLASS-vTk-long-cross-source-only
          retention-days: 30
          if-no-files-found: warn
          path: eboss_workspace/a03_physics_source/e12_direct_vTk_long_cross/*.json
