name: Production - nonlinear RSD hidden-state control

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/rsd_hidden_state_forecast.py'
      - 'code/rsd_hidden_state_forecast_nonlinear.py'
      - 'code/class_response_optimize.py'
      - '.github/workflows/rsd_hidden_state_forecast.yml'

jobs:
  rsd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip setuptools wheel numpy scipy cython
      - name: Fetch pinned CLASS
        run: |
          git init class_public
          git -C class_public remote add origin https://github.com/lesgourg/class_public.git
          git -C class_public fetch --depth 1 origin e85808324f51fc694d12e3ed7439552a3c3f9540
          git -C class_public checkout --detach FETCH_HEAD
          test "$(git -C class_public rev-parse HEAD)" = "e85808324f51fc694d12e3ed7439552a3c3f9540"
      - name: Install CLASS
        run: python -m pip install ./class_public
      - name: Run nonlinear projected RSD optimization
        run: |
          python code/rsd_hidden_state_forecast_nonlinear.py \
            --outdir rsd_hidden_state_output \
            --mass 0.60 --z-match 1100 \
            --probe-frac 0.01 --final-frac 0.30 \
            --volume 50 --samples 30000 --keep 28 --seed 20260913
      - name: Record CLASS commit
        if: always()
        run: |
          mkdir -p rsd_hidden_state_output
          git -C class_public rev-parse HEAD > rsd_hidden_state_output/CLASS_COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rsd-hidden-state-nonlinear
          path: rsd_hidden_state_output/
          if-no-files-found: error
