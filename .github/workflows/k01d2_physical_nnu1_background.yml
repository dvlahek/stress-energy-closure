name: K01D2 physical Nnu1 background path

on:
  push:
    branches:
      - experiment/k01-matched-f-detectability-20261105
    paths:
      - "scripts/k01d2_apply_universe_age_tolerance_patch.py"
      - "scripts/k01d2_finalize_physical_nnu1_background.py"
      - "source_data/k01d2_physical_nnu1_background_path_prereg_2026-11-06.json"
      - ".github/workflows/k01d2_physical_nnu1_background.yml"
  pull_request:
    branches:
      - audit/eboss-elg-bit8-ra-orientation-20260925
    paths:
      - "scripts/k01d2_apply_universe_age_tolerance_patch.py"
      - "scripts/k01d2_finalize_physical_nnu1_background.py"
      - "source_data/k01d2_physical_nnu1_background_path_prereg_2026-11-06.json"
      - ".github/workflows/k01d2_physical_nnu1_background.yml"
  workflow_dispatch:

jobs:
  physical_background:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout stress-energy-closure
        uses: actions/checkout@v4

      - name: Checkout pinned SWIFT
        uses: actions/checkout@v4
        with:
          repository: SWIFTSIM/SWIFT
          ref: e1a963fa682061498a5a59da1b3e1521e9eae724
          path: external/SWIFT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libhdf5-dev libfftw3-dev libgsl-dev libnuma-dev
          python -m pip install --upgrade pip numpy h5py

      - name: Apply exact audited universe-age patch
        run: python -u scripts/k01d2_apply_universe_age_tolerance_patch.py

      - name: Build pinned patched SWIFT
        run: |
          set -euo pipefail
          cd external/SWIFT
          ./autogen.sh
          ./configure --disable-mpi --disable-optimization --disable-doxygen-doc --disable-compiler-warnings --with-potential=constant
          make -j2
          git rev-parse HEAD

      - name: Prepare physical Nnu1 calibration
        run: python -u scripts/k01d1_swift_custom_f_transport_smoke.py prepare-calibration

      - name: Run physical Nnu1 calibration
        run: |
          set -euo pipefail
          cd k01d1_swift_work/calibration
          ../../external/SWIFT/swift -c -g --threads=2 calibration.yml 2>&1 | tee calibration.log

      - name: Extract SWIFT calibrated macro mass
        run: python -u scripts/k01d1_swift_custom_f_transport_smoke.py extract-calibration

      - name: Prepare matched FD Fplus Fminus science ICs
        run: python -u scripts/k01d1_swift_custom_f_transport_smoke.py prepare-science

      - name: Run three physical-background custom-F transport jobs
        run: |
          set -euo pipefail
          for state in FD Fplus Fminus; do
            echo "=== K01D2 SWIFT STATE $state ==="
            (
              cd "k01d1_swift_work/science/$state"
              ../../../external/SWIFT/swift -c -g --threads=2 science.yml 2>&1 | tee swift.log
            )
          done

      - name: Analyze original transport gates
        run: python -u scripts/k01d1_swift_custom_f_transport_smoke.py analyze

      - name: Freeze K01D2 result
        run: python -u scripts/k01d2_finalize_physical_nnu1_background.py

      - name: Show K01D2 result
        if: always()
        run: |
          if [ -f k01d2_physical_nnu1_background_result.json ]; then
            cat k01d2_physical_nnu1_background_result.json
          fi
          echo "=== audited patch ==="
          cat k01d2_swift_universe_age_patch.diff 2>/dev/null || true
          echo "=== calibration tail ==="
          tail -80 k01d1_swift_work/calibration/calibration.log 2>/dev/null || true

      - name: Upload K01D2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k01d2-physical-nnu1-background
          path: |
            k01d2_physical_nnu1_background_result.json
            k01d1_swift_transport_result.json
            k01d2_swift_universe_age_patch.diff
            k01d1_swift_work/calibrated_macro_mass.json
            k01d1_swift_work/calibration/calibration.log
            k01d1_swift_work/science/FD/swift.log
            k01d1_swift_work/science/Fplus/swift.log
            k01d1_swift_work/science/Fminus/swift.log
          if-no-files-found: warn
