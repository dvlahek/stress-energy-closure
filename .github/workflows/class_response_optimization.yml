name: CLASS response optimization

on:
  workflow_dispatch:
  push:
    branches:
      - class-response-optimization
    paths:
      - 'code/class_response_optimize.py'
      - 'observational_forecast/high_precision.pre'
      - '.github/workflows/class_response_optimization.yml'

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip numpy

      - name: Fetch pinned CLASS
        run: |
          git init class_public
          git -C class_public remote add origin https://github.com/lesgourg/class_public.git
          git -C class_public fetch --depth 1 origin e85808324f51fc694d12e3ed7439552a3c3f9540
          git -C class_public checkout --detach FETCH_HEAD
          test "$(git -C class_public rev-parse HEAD)" = "e85808324f51fc694d12e3ed7439552a3c3f9540"

      - name: Build CLASS
        run: make -C class_public class -j2

      - name: Optimize response across mass sweep
        run: |
          set -euo pipefail
          mkdir -p response_optimization_output
          for item in 003:0.03 006:0.06 010:0.10 018:0.18 030:0.30 060:0.60; do
            tag="${item%%:*}"
            mass="${item##*:}"
            out="response_optimization_output/mass_${tag}"
            echo "=== mass=${mass} eV ==="

            python code/class_response_optimize.py \
              --mode prepare-probes --outdir "$out" --mass-eV "$mass" \
              --z-match 1100 --probe-frac 0.02 --class-lmax 350

            for ini in "$out"/probe_*_plus.ini "$out"/probe_*_minus.ini; do
              ./class_public/class "$ini"
            done

            python code/class_response_optimize.py \
              --mode optimize --outdir "$out" --final-frac 0.30 \
              --lmin 20 --lmax 300 --random-samples 50000 --seed 271828

            ./class_public/class "$out/final_plus.ini"
            ./class_public/class "$out/final_minus.ini"

            python code/class_response_optimize.py \
              --mode summarize-final --outdir "$out" --lmin 20 --lmax 300 --tag default
          done

      - name: Aggregate mass sweep
        run: |
          python code/class_response_optimize.py \
            --mode aggregate --outdir response_optimization_output --lmin 20 --lmax 300

      - name: High-precision confirmation of best mass
        run: |
          set -euo pipefail
          best=$(python - <<'PY'
          import json
          print(json.load(open('response_optimization_output/best_candidate.json'))['best_directory'])
          PY
          )
          out="response_optimization_output/$best"
          echo "High-precision confirmation: $out"
          ./class_public/class "$out/final_plus.ini" observational_forecast/high_precision.pre
          ./class_public/class "$out/final_minus.ini" observational_forecast/high_precision.pre
          python code/class_response_optimize.py \
            --mode summarize-final --outdir "$out" --lmin 20 --lmax 300 --tag highprecision
          echo "$best" > response_optimization_output/HIGHPRECISION_CANDIDATE.txt

      - name: Validate optimized signal
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          import numpy as np

          root=Path('response_optimization_output')
          best=json.loads((root/'best_candidate.json').read_text())['best_directory']
          d=root/best
          a=json.loads((d/'final_summary_default.json').read_text())
          h=json.loads((d/'final_summary_highprecision.json').read_text())
          x=np.genfromtxt(d/'final_bmode_comparison_default.csv', delimiter=',', names=True)
          y=np.genfromtxt(d/'final_bmode_comparison_highprecision.csv', delimiter=',', names=True)
          if not np.array_equal(x['ell'], y['ell']):
              raise RuntimeError('default/high-precision ell grids differ')
          dx=x['symmetric_relative_difference_percent']
          dy=y['symmetric_relative_difference_percent']
          sel=(x['ell']>=20)&(x['ell']<=300)
          payload={
              'best_directory':best,
              'mass_eV':h['mass_eV'],
              'default_cv_SN':a['actual_ideal_fullsky_cv_SN'],
              'highprecision_cv_SN':h['actual_ideal_fullsky_cv_SN'],
              'default_max_percent':a['actual_max_abs_relative_difference_percent'],
              'highprecision_max_percent':h['actual_max_abs_relative_difference_percent'],
              'highprecision_ell_at_max':h['ell_at_actual_max'],
              'max_absolute_default_highprecision_change_percentage_points_ell20_300':float(np.max(np.abs(dx[sel]-dy[sel]))),
              'highprecision_percent_at_ell80':h['relative_difference_percent_at_ell80'],
              'moment_mismatch':h['max_relative_moment_mismatch'],
          }
          (root/'highprecision_validation.json').write_text(json.dumps(payload,indent=2)+'\n')
          print(json.dumps(payload,indent=2))
          PY

      - name: Record solver commit
        if: always()
        run: git -C class_public rev-parse HEAD > response_optimization_output/CLASS_COMMIT.txt

      - name: Upload optimization artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class-response-optimization
          path: response_optimization_output/
          if-no-files-found: error
