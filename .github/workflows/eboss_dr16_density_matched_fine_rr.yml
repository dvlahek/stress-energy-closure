name: eBOSS DR16 density-matched high-z RR controls

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_eboss_dr16_density_matched_fine_rr.py'
      - '.github/workflows/eboss_dr16_density_matched_fine_rr.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  density-matched-random-only:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      GH_TOKEN: ${{ github.token }}
      PINNED_OBSERVED_RUN: '35983196267'
      PINNED_OBSERVED_SHA: '5dbfca45c25c7af57bf05693022bfa98b499209d'
      PINNED_MOCK_0001_RUN: '35984016654'
      PINNED_MOCK_0001_SHA: '009ff8873ae149e622a9ef22a33ada73d59fcc86'
      PINNED_MOCK_STRATIFIED_RUN: '35984421963'
      PINNED_MOCK_STRATIFIED_SHA: 'b4e8434f389b399ab7142af1894b14c82907d5b8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned compiled pair-counter dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-desi.txt
      - name: Check exact deterministic counts and no-replacement draw
        run: python scripts/audit_eboss_dr16_density_matched_fine_rr.py --self-test
      - name: Retrieve three successful, SHA-pinned input workflow artifacts
        run: |
          gh run download "$PINNED_OBSERVED_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name eboss-dr16-fine-rr-highz \
            --dir observed_fine_input
          gh run download "$PINNED_MOCK_0001_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name eboss-dr16-matched-mock-fine-rr-pinned \
            --dir mock_0001_input
          gh run download "$PINNED_MOCK_STRATIFIED_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name eboss-dr16-stratified-matched-mock-fine-rr \
            --dir mock_stratified_input
          test -s observed_fine_input/fine_rr_highz_audit.json
          test -s observed_fine_input/fine_rr_highz_audit.npz
          test -s mock_0001_input/matched_mock_fine_rr.json
          test -s mock_0001_input/matched_mock_fine_rr.npz
          test -s mock_stratified_input/matched_mock_fine_rr_0500.json
          test -s mock_stratified_input/matched_mock_fine_rr_0500.npz
          test -s mock_stratified_input/matched_mock_fine_rr_1000.json
          test -s mock_stratified_input/matched_mock_fine_rr_1000.npz
      - name: Run four fixed count-matched observed random draws for each mock and cap
        run: |
          python scripts/audit_eboss_dr16_density_matched_fine_rr.py \
            --observed-rr observed_fine_input/fine_rr_highz_audit.npz \
            --observed-audit observed_fine_input/fine_rr_highz_audit.json \
            --mock-0001-rr mock_0001_input/matched_mock_fine_rr.npz \
            --mock-0001-audit mock_0001_input/matched_mock_fine_rr.json \
            --mock-stratified-dir mock_stratified_input \
            --threads 2 \
            --out eboss_workspace/density_matched_rr_audit.json
      - name: Retain input-only count-matched noise and operator controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eboss-dr16-density-matched-random-only-rr
          path: eboss_workspace/density_matched_rr_audit.json
          if-no-files-found: warn
