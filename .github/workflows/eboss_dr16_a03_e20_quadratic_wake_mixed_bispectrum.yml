name: eBOSS A03 E20 mixed three-point structural math-only
on:
  push:
    branches:
      - audit/eboss-elg-bit8-ra-orientation-20260925
    paths:
      - 'source_data/eboss_dr16_a03_e20_*'
      - 'scripts/audit_eboss_dr16_a03_e20_quadratic_wake_mixed_bispectrum.py'
      - '.github/workflows/eboss_dr16_a03_e20_quadratic_wake_mixed_bispectrum.yml'
      - 'EINSTEIN_VLASOV_NP_MASTER_PLAN.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-source-only-analytic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify five original prospective source Git blobs
        run: |
          set -euo pipefail
          test "$(git hash-object source_data/eboss_dr16_a03_e20_quadratic_wake_mixed_bispectrum_structural_protocol_2026-09-29.json)" = 300f73be14306ccf45342592e842e30bda63b8c6
          test "$(git hash-object source_data/eboss_dr16_a03_e10_frozen_conditional_angular_wind_parity_summary_2026-09-27.json)" = a9e0f49a58b9fd5e0ad975d4d14ba6521a648c28
          test "$(git hash-object source_data/eboss_dr16_a03_e19_posthoc_conditional_Fourier_shape_and_marginal_RR_nonidentifiability_2026-09-29.json)" = fc5044684b84ff3de86c236988617ead79d8e7e6
          test "$(git hash-object source_data/eboss_dr16_a03_e6_physical_template_to_empirical_window_bridge_protocol_2026-09-27.json)" = 4df20872cff5b3d8aa09831ab50b22fa5f8b6581
          test "$(git hash-object docs/EBOSS_DR16_A03_E17D1_RESTRICTED_CAUSAL_SOURCE_HISTORY_NONIDENTIFIABILITY_2026-09-27.md)" = 3a536aa384eec1a202e77c532beb3a55c7333cb2
          echo E20_PINNED_SOURCE_AND_PREREG_PASS
      - name: Exact finite moment closure and five negative controls
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/audit_eboss_dr16_a03_e20_quadratic_wake_mixed_bispectrum.py
          python3 -u scripts/audit_eboss_dr16_a03_e20_quadratic_wake_mixed_bispectrum.py \
            --out "$RUNNER_TEMP/e20_structural_math_only.json"
          echo E20_SOURCE_ONLY_STRUCTURAL_CI_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: E20_source_only_quadratic_wake_structural_moment_QA
          path: ${{ runner.temp }}/e20_structural_math_only.json
          if-no-files-found: error
