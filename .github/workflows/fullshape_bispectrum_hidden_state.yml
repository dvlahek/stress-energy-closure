name: Full-shape plus bispectrum hidden-state diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - fullshape-wake-upgrade
    paths:
      - 'code/fullshape_bispectrum_hidden_state.py'
      - 'code/class_response_optimize.py'
      - '.github/workflows/fullshape_bispectrum_hidden_state.yml'

jobs:
  fullshape-bispectrum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip setuptools wheel numpy scipy cython
      - name: Fetch pinned CLASS
        run: |
          git init class_public
          git -C class_public remote add origin https://github.com/lesgourg/class_public.git
          git -C class_public fetch --depth 1 origin e85808324f51fc694d12e3ed7439552a3c3f9540
          git -C class_public checkout --detach FETCH_HEAD
          test "$(git -C class_public rev-parse HEAD)" = "e85808324f51fc694d12e3ed7439552a3c3f9540"
      - name: Install pinned CLASS Python wrapper
        run: python -m pip install ./class_public
      - name: Run P+B diagnostic
        run: |
          python code/fullshape_bispectrum_hidden_state.py \
            --outdir fullshape_bispectrum_output \
            --mass 0.60 \
            --z-match 1100 \
            --probe-frac 0.01 \
            --final-frac 0.30 \
            --samples 12000 \
            --keep 14 \
            --seed 20260913
      - name: Record CLASS commit
        if: always()
        run: |
          mkdir -p fullshape_bispectrum_output
          git -C class_public rev-parse HEAD > fullshape_bispectrum_output/CLASS_COMMIT.txt
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullshape-bispectrum-hidden-state
          path: fullshape_bispectrum_output/
          if-no-files-found: error
