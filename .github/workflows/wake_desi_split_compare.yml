name: DESI BGS halo-mass split hidden-state Fisher

on:
  push:
    branches: [fullshape-wake-upgrade]
    paths:
      - 'code/wake_desi_split_compare_fisher.py'
      - '.github/workflows/wake_desi_split_compare.yml'
  workflow_dispatch:

jobs:
  fisher:
    strategy:
      fail-fast: false
      matrix:
        split: ['14.00','14.25','14.50']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip setuptools wheel numpy scipy cython
      - name: Fetch pinned CLASS
        run: |
          git init class_public
          git -C class_public remote add origin https://github.com/lesgourg/class_public.git
          git -C class_public fetch --depth 1 origin e85808324f51fc694d12e3ed7439552a3c3f9540
          git -C class_public checkout --detach FETCH_HEAD
          test "$(git -C class_public rev-parse HEAD)" = "e85808324f51fc694d12e3ed7439552a3c3f9540"
      - name: Install CLASS
        run: python -m pip install ./class_public
      - name: Run threshold Fisher
        run: |
          python code/wake_desi_split_compare_fisher.py \
            --split '${{ matrix.split }}' \
            --outdir 'wake_split_${{ matrix.split }}' \
            --mass 0.06 \
            --z-match 1100 \
            --frac 0.30 \
            --samples 50000 \
            --validate 5 \
            --seed 20260913
      - name: Record CLASS commit
        run: git -C class_public rev-parse HEAD > 'wake_split_${{ matrix.split }}/CLASS_COMMIT.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: wake-desi-split-${{ matrix.split }}
          path: wake_split_${{ matrix.split }}/
          if-no-files-found: error
