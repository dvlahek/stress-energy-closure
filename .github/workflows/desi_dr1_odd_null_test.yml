name: Validation - DESI DR1 parity-odd null test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/desi_dr1_odd_null_test.py'
      - '.github/workflows/desi_dr1_odd_null_test.yml'

jobs:
  nulltest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy astropy
      - name: Download public DESI DR1 Gfinder group catalogue
        run: |
          PRIMARY="https://data.desi.lbl.gov/public/dr1/vac/dr1/gfinder/v1.0/DESIDR9.y1.v1_group.fits"
          MIRROR="https://webdav-hdfs.pic.es/data/public/DESI/DR1/vac/dr1/gfinder/v1.0/DESIDR9.y1.v1_group.fits"
          if ! curl -fL --retry 1 --retry-delay 5 --connect-timeout 20 --max-time 300 \
              -o DESIDR9.y1.v1_group.fits "$PRIMARY"; then
            echo "Primary DESI host unavailable; using official European DR1 mirror"
            rm -f DESIDR9.y1.v1_group.fits
            curl -fL --retry 4 --retry-delay 5 --connect-timeout 20 --max-time 600 \
              -o DESIDR9.y1.v1_group.fits "$MIRROR"
          fi
          ls -lh DESIDR9.y1.v1_group.fits
      - name: Run parity-odd null test
        run: |
          python code/desi_dr1_odd_null_test.py \
            --fits DESIDR9.y1.v1_group.fits \
            --outdir desi_dr1_odd_null \
            --split 13.75 --zmin 0.05 --zmax 0.40 --dz-match 0.02 \
            --max-per-class 12000 --permutations 40 --seed 20260913
      - uses: actions/upload-artifact@v4
        with:
          name: desi-dr1-odd-null-test
          path: desi_dr1_odd_null/
          if-no-files-found: error
