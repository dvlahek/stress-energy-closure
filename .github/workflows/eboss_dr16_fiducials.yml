name: eBOSS DR16 published fiducial distance check

on:
  push:
    branches: [main]
    paths:
      - 'scripts/check_eboss_dr16_fiducials.py'
      - '.github/workflows/eboss_dr16_fiducials.yml'
  workflow_dispatch:

jobs:
  distance-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent distance libraries
        run: python -m pip install 'numpy>=1.24' 'scipy>=1.10' 'astropy>=5.3'
      - name: Cross-check literature eBOSS background distances
        run: |
          python scripts/check_eboss_dr16_fiducials.py \
            --out eboss_workspace/fiducial_distance_audit.json
      - name: Retain background-only distance report
        uses: actions/upload-artifact@v4
        with:
          name: eboss-dr16-fiducial-distance
          path: eboss_workspace/fiducial_distance_audit.json
          if-no-files-found: error
