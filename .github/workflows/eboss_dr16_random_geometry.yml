name: eBOSS DR16 real-mock random geometry

on:
  push:
    branches: [main]
    paths:
      - 'scripts/compare_eboss_dr16_random_geometry.py'
      - '.github/workflows/eboss_dr16_random_geometry.yml'
  workflow_dispatch:

jobs:
  compare-random-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install array and FITS dependencies
        run: python -m pip install 'numpy>=1.24' 'astropy>=5.3'
      - name: Test density-normalized support comparison
        run: python scripts/compare_eboss_dr16_random_geometry.py --self-test
      - name: Compare observed and matched mock random geometry
        run: |
          python scripts/compare_eboss_dr16_random_geometry.py \
            --chunk-rows 200000 \
            --out eboss_workspace/real_mock_random_geometry.json
      - name: Retain selection-only geometry diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eboss-dr16-real-mock-random-geometry
          path: eboss_workspace/real_mock_random_geometry.json
          if-no-files-found: warn
