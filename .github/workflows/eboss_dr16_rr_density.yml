name: eBOSS DR16 blinded RR random-density diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_eboss_dr16_rr_density.py'
      - '.github/workflows/eboss_dr16_rr_density.yml'
  workflow_dispatch:

jobs:
  rr-density:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FITS, distance and array dependencies
        run: python -m pip install 'numpy>=1.24' 'scipy>=1.10' 'astropy>=5.3'
      - name: Test nested sampling and histogram comparison
        run: python scripts/audit_eboss_dr16_rr_density.py --self-test
      - name: Audit RR sampling density without observed galaxies
        run: |
          python scripts/audit_eboss_dr16_rr_density.py \
            --out eboss_workspace/rr_density_diagnostic.json
      - name: Preserve random-only density report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eboss-dr16-rr-density
          path: eboss_workspace/rr_density_diagnostic.json
          if-no-files-found: warn
