name: eBOSS DR16 A03E13 independent original-source Gamma and filtered long B replay
on:
  push:
    branches:
      - audit/eboss-elg-bit8-ra-orientation-20260925
    paths:
      - 'scripts/audit_eboss_dr16_a03_e13_independent_original_source_replay.py'
      - '.github/workflows/eboss_dr16_a03_e13_independent_source_replay.yml'
permissions:
  contents: write
jobs:
  original-independent-source-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only deterministic source-only numerical dependency
        run: python -m pip install 'numpy==1.26.4'
      - name: Independently recompute original frozen Gamma, W16 and same-rank Bsource from GitHub archived outputs
        run: |
          python -m py_compile scripts/audit_eboss_dr16_a03_e13_independent_original_source_replay.py
          python -u scripts/audit_eboss_dr16_a03_e13_independent_original_source_replay.py
      - name: Commit exact independent audit JSON on existing draft PR audit branch
        run: |
          set -eu
          out=source_data/eboss_dr16_a03_e13_independent_original_source_replay_2026_09_27.json
          cp eboss_workspace/a03_physics_source/e13_independent_source_replay.json "$out"
          sha256sum "$out"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$out"
          if git diff --cached --quiet; then
            echo "E13_INDEPENDENT_CERTIFICATE_ALREADY_ARCHIVED"
          else
            git commit -m "audit(E13): permanently archive independent original-source 96x512 Gamma and filtered direct-rank long-product verification"
            git push origin HEAD:refs/heads/audit/eboss-elg-bit8-ra-orientation-20260925
          fi
          echo "E13_INDEPENDENT_CERTIFICATE_ARCHIVED_ON_GITHUB"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eboss-a03-e13-independent-direct-rank-gamma-and-filtered-product-source-only
          path: eboss_workspace/a03_physics_source/e13_independent_source_replay.json
          if-no-files-found: warn
          retention-days: 30
