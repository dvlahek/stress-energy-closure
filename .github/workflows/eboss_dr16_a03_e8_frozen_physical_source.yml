name: eBOSS DR16 A03E8 frozen kinetic resonant source (no CLASS/FITS)
on:
  push:
    branches:
      - audit/eboss-elg-bit8-ra-orientation-20260925
    paths:
      - 'scripts/build_eboss_dr16_a03_e8_frozen_resonant_occupation.py'
      - 'source_data/eboss_dr16_a03_e8_frozen_resonant_occupancy_protocol_2026-09-27.json'
      - '.github/workflows/eboss_dr16_a03_e8_frozen_physical_source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-kinetic-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy only, no CLASS, no FITS/network catalogues
        run: python -m pip install 'numpy>=1.24,<2.4'
      - name: Syntax and original-SHA negative controls
        run: |
          python -m py_compile scripts/build_eboss_dr16_a03_e8_frozen_resonant_occupation.py
          python -u scripts/build_eboss_dr16_a03_e8_frozen_resonant_occupation.py --self-test
      - name: Build original CLASS-normalized F0/F+/F- and exact FD-relative conditional resonant source
        run: python -u scripts/build_eboss_dr16_a03_e8_frozen_resonant_occupation.py --output-dir eboss_workspace/a03_physics_source/e8_frozen_kinetic_resonance
      - uses: actions/upload-artifact@v4
        with:
          name: eboss-a03-e8-frozen-source-only-kinetic-and-conditional-resonance
          if-no-files-found: error
          retention-days: 30
          path: |
            eboss_workspace/a03_physics_source/e8_frozen_kinetic_resonance/frozen_matched_distributions_4000q.csv
            eboss_workspace/a03_physics_source/e8_frozen_kinetic_resonance/conditional_resonant_source_response.json
