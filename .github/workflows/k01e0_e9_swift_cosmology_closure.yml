name: K01E0 frozen-E9 SWIFT cosmology closure

on:
  push:
    branches:
      - experiment/k01-matched-f-detectability-20261105
    paths:
      - "scripts/k01e0_e9_swift_cosmology_closure.py"
      - "source_data/k01e0_e9_swift_cosmology_closure_prereg_2026-11-06.json"
      - ".github/workflows/k01e0_e9_swift_cosmology_closure.yml"
  pull_request:
    branches:
      - audit/eboss-elg-bit8-ra-orientation-20260925
    paths:
      - "scripts/k01e0_e9_swift_cosmology_closure.py"
      - "source_data/k01e0_e9_swift_cosmology_closure_prereg_2026-11-06.json"
      - ".github/workflows/k01e0_e9_swift_cosmology_closure.yml"
  workflow_dispatch:

jobs:
  closure:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SWIFTSIM/SWIFT
          ref: e1a963fa682061498a5a59da1b3e1521e9eae724
          path: external/SWIFT
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libhdf5-dev libfftw3-dev libgsl-dev libnuma-dev
          python -m pip install --upgrade pip numpy h5py
      - name: Apply audited K01D2 universe-age patch
        run: python -u scripts/k01d2_apply_universe_age_tolerance_patch.py
      - name: Build pinned patched SWIFT
        run: |
          cd external/SWIFT
          ./autogen.sh
          ./configure --disable-mpi --disable-optimization --disable-doxygen-doc --disable-compiler-warnings --with-potential=constant
          make -j2
      - name: Prepare K01E0 calibration
        run: python -u scripts/k01e0_e9_swift_cosmology_closure.py prepare
      - name: Run K01E0 calibration
        run: |
          cd k01e0_swift_closure_work
          ../external/SWIFT/swift -c -g --threads=2 calibration.yml 2>&1 | tee swift.log
      - name: Analyze K01E0 closure
        run: python -u scripts/k01e0_e9_swift_cosmology_closure.py analyze
      - name: Show result
        if: always()
        run: |
          cat k01e0_e9_swift_cosmology_closure_result.json 2>/dev/null || true
          tail -80 k01e0_swift_closure_work/swift.log 2>/dev/null || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k01e0-e9-swift-cosmology-closure
          path: |
            k01e0_e9_swift_cosmology_closure_result.json
            k01e0_swift_closure_work/swift.log
            k01d2_swift_universe_age_patch.diff
          if-no-files-found: warn
