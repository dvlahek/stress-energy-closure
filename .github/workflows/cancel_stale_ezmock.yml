name: Cancel stale EZmock Phase 7 run

on:
  push:
    branches: [phase7-nature-astronomy]
    paths:
      - '.github/workflows/cancel_stale_ezmock.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel stale run 34779213479
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dvlahek/stress-energy-closure/actions/runs/34779213479/cancel
