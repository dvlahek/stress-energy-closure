name: eBOSS A03 E17D2b3b8 pinned source-only L1 threshold and M200c feasibility
on:
  push:
    branches:
      - audit/eboss-elg-bit8-ra-orientation-20260925
    paths:
      - 'source_data/eboss_dr16_a03_e17d2b3b8_*'
      - 'scripts/audit_eboss_dr16_a03_e17d2b3b8_source_only_L1_M200c_feasibility.py'
      - '.github/workflows/eboss_a03_e17d2b3b8_source_only_M200c_feasibility.yml'
      - 'EINSTEIN_VLASOV_NP_MASTER_PLAN.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-no-real-ASDF:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout audit source only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin official AbacusSummit TEXT docs
        uses: actions/checkout@v4
        with:
          repository: abacusorg/AbacusSummit
          ref: 4b1959c710cb0c49aa305c6213a228aa2a4587ff
          path: official-abacussummit
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            docs/data-products.rst
            docs/compaso.rst
      - name: Pin official abacusutils TEXT loader
        uses: actions/checkout@v4
        with:
          repository: abacusorg/abacusutils
          ref: 24ab0dda5fea9ae406b1afdacaf4bbf989de9bc6
          path: official-abacusutils
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            abacusnbody/data/compaso_halo_catalog.py
      - name: Check Git source pins only
        run: |
          set -euo pipefail
          test "$(git hash-object source_data/eboss_dr16_a03_e17d2b3b8_official_source_only_L1_threshold_and_M200c_feasibility_prereg_2026-09-29.json)" = 40abc1616ea85d96ec9cb2ba2ca26dc6a8d6fe22
          test "$(git hash-object source_data/eboss_dr16_a03_e17d2b3b7r1_user_uploaded_local_id_N_result_and_existing_output_failure_diagnostic_2026-09-29.json)" = f27ed284c95e48548e50336da04c1a1d4b137186
          test "$(git hash-object source_data/eboss_dr16_a03_e17d2b3b2_archived_CI_2026_09_28/e17d2b3b2_pinned_header_copy_l1_threshold_vs_200crit.json)" = cb911e0f7864738695f20fe3228826374d343378
          test "$(git -C official-abacussummit rev-parse HEAD)" = 4b1959c710cb0c49aa305c6213a228aa2a4587ff
          test "$(git -C official-abacusutils rev-parse HEAD)" = 24ab0dda5fea9ae406b1afdacaf4bbf989de9bc6
          test "$(git hash-object official-abacussummit/docs/data-products.rst)" = f7c847b174365744b23cb6d1ebaeb010a5bd6ca7
          test "$(git hash-object official-abacussummit/docs/compaso.rst)" = a5170574467501e0b9adb4a71e8e432a32843dbf
          test "$(git hash-object official-abacusutils/abacusnbody/data/compaso_halo_catalog.py)" = adb16aee1cbac863db5301c6e380938ee7f76547
          echo E17D2B3B8_PINNED_UPSTREAM_AND_PARENT_GIT_BLOBS_PASS
      - name: Syntax, source-only semantics and eight synthetic negatives
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/audit_eboss_dr16_a03_e17d2b3b8_source_only_L1_M200c_feasibility.py
          python3 -u scripts/audit_eboss_dr16_a03_e17d2b3b8_source_only_L1_M200c_feasibility.py \
            --docs official-abacussummit/docs/data-products.rst \
            --compaso official-abacussummit/docs/compaso.rst \
            --loader official-abacusutils/abacusnbody/data/compaso_halo_catalog.py \
            --self-test \
            --output "$RUNNER_TEMP/e17d2b3b8_source_only_report.json"
          echo E17D2B3B8_SOURCE_ONLY_CI_PASS_NO_REAL_ABACUS_NO_OBSERVED_EBOSS
