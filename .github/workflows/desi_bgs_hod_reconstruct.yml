name: DESI BGS HOD reconstruction

on:
  push:
    branches: [fullshape-wake-upgrade]
    paths:
      - 'code/desi_bgs_hod_reconstruct.py'
      - '.github/workflows/desi_bgs_hod_reconstruct.yml'
  workflow_dispatch:

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install scientific dependencies
        run: python -m pip install --upgrade pip numpy scipy matplotlib astropy hmf halomod
      - name: Fetch public BGS HOD
        run: git clone https://github.com/amjsmith/hodpy.git hodpy_public
      - name: Install hodpy
        run: python -m pip install ./hodpy_public
      - name: Reconstruct BGS split
        run: python code/desi_bgs_hod_reconstruct.py
      - name: Record software provenance
        run: |
          git -C hodpy_public rev-parse HEAD > desi_bgs_hod_output/HODPY_COMMIT.txt
          python - <<'PY'
          import hmf, halomod
          from pathlib import Path
          Path('desi_bgs_hod_output/PYTHON_PACKAGES.txt').write_text('hmf='+getattr(hmf,'__version__','unknown')+'\nhalomod='+getattr(halomod,'__version__','unknown')+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: desi-bgs-hod-reconstruction
          path: desi_bgs_hod_output/
