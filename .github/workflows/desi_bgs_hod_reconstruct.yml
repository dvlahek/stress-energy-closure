name: DESI BGS HOD reconstruction

on:
  push:
    branches: [fullshape-wake-upgrade]
    paths:
      - 'code/desi_bgs_hod_reconstruct.py'
      - '.github/workflows/desi_bgs_hod_reconstruct.yml'
  workflow_dispatch:

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install scientific dependencies
        run: python -m pip install --upgrade pip 'numpy<2' 'scipy==1.13.1' matplotlib astropy hmf halomod
      - name: Fetch public BGS HOD
        run: git clone https://github.com/amjsmith/hodpy.git hodpy_public
      - name: Compatibility patch unused nbodykit defaults
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('hodpy_public/hodpy/hod_bgs.py')
          s=p.read_text()
          s=s.replace('from hodpy.mass_function import MassFunctionMXXL\n','')
          s=s.replace('from hodpy.cosmology import CosmologyMXXL\n','')
          for old,new in [
              ('mass_function=MassFunctionMXXL()', 'mass_function=None'),
              ('cosmology=CosmologyMXXL()', 'cosmology=None'),
              ('kcorr=GAMA_KCorrection(CosmologyMXXL())', 'kcorr=None'),
              ('        self.mf = MassFunctionMXXL()\n', '        self.mf = None\n'),
          ]:
              s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Reconstruct BGS split
        env:
          PYTHONPATH: ${{ github.workspace }}/hodpy_public
        run: python code/desi_bgs_hod_reconstruct.py
      - name: Record software provenance
        run: |
          git -C hodpy_public rev-parse HEAD > desi_bgs_hod_output/HODPY_COMMIT.txt
          python - <<'PY'
          import hmf, halomod, scipy, numpy
          from pathlib import Path
          Path('desi_bgs_hod_output/PYTHON_PACKAGES.txt').write_text(
              'numpy='+numpy.__version__+'\nscipy='+scipy.__version__+'\nhmf='+getattr(hmf,'__version__','unknown')+'\nhalomod='+getattr(halomod,'__version__','unknown')+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: desi-bgs-hod-reconstruction
          path: desi_bgs_hod_output/
