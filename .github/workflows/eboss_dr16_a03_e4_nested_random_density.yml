name: eBOSS DR16 A-03E4 pre-FITS 1200/2400/4800 nested mock random density SOURCE-ONLY

on:
  push:
    branches:
      - audit/eboss-elg-bit8-ra-orientation-20260925
    paths:
      - 'scripts/audit_eboss_dr16_a03_e4_nested_random_density.py'
      - 'source_data/eboss_dr16_a03_e4_nested_1200_2400_4800_mock_random_density_protocol_2026-09-27.json'
      - '.github/workflows/eboss_dr16_a03_e4_nested_random_density.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prospective-frozen-E4-nesting-and-source-gates-NO-FITS:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original numerical dependencies
        run: python -m pip install 'numpy>=1.24,<2.4' 'astropy>=6,<8' 'scipy>=1.11,<2'
      - name: Compile source-only E4 runner
        run: python -m py_compile scripts/audit_eboss_dr16_a03_e4_nested_random_density.py
      - name: Test frozen source gate, PCG64 complements, nested 1200/2400/4800 and fail-closed negatives
        run: python -u scripts/audit_eboss_dr16_a03_e4_nested_random_density.py --self-test
