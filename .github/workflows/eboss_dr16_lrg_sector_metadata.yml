name: eBOSS DR16 LRG sector-only aggregate synthetic audit

on:
  push:
    branches:
      - audit/eboss-elg-bit8-ra-orientation-20260925
    paths:
      - 'scripts/audit_eboss_dr16_lrg_sector_metadata.py'
      - 'source_data/eboss_dr16_lrg_sector_metadata_protocol_2026-09-25.json'
      - '.github/workflows/eboss_dr16_lrg_sector_metadata.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-no-real-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy for synthetic four-column-only sector audit
        run: python -m pip install 'numpy>=1.24,<2.4'
      - name: Check synthetic FITS byte-stride, aggregation, nonfinite fail-closed and no odd data
        run: python -u scripts/audit_eboss_dr16_lrg_sector_metadata.py --self-test
