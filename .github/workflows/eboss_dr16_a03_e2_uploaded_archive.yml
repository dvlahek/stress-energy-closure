name: eBOSS DR16 A-03E2 exact original uploaded report and 18x3 source-only archive audit

on:
  push:
    branches:
      - audit/eboss-elg-bit8-ra-orientation-20260925
    paths:
      - 'scripts/audit_eboss_dr16_a03_e2_uploaded_archive.py'
      - 'source_data/eboss_dr16_a03_e2_mock_galaxy_elg_random_radial_weight_stress_report_2026-09-26.json'
      - 'source_data/eboss_dr16_a03_e2_mock_galaxy_elg_random_radial_weight_stress_uploaded_manifest_2026-09-26.json'
      - 'source_data/eboss_dr16_a03_e2_mock_galaxy_elg_random_radial_weight_stress_protocol_2026-09-26.json'
      - '.github/workflows/eboss_dr16_a03_e2_uploaded_archive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-original-upload-and-negative-controls-NO-FITS:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile immutable original A-03E2 report auditor
        run: python -m py_compile scripts/audit_eboss_dr16_a03_e2_uploaded_archive.py
      - name: Verify archived 413189-byte exact source and all 18x3 baseline/perturbed cases (no FITS/observed)
        run: python -u scripts/audit_eboss_dr16_a03_e2_uploaded_archive.py --self-test
