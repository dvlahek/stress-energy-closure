name: Diagnose EZmock luminosity metadata

on:
  push:
    branches: [phase7-nature-astronomy]
    paths:
      - '.github/workflows/diagnose_ezmock_luminosity.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip astropy
      - name: Fetch mock1 products and inspect all HDUs
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://data.desi.lbl.gov/public/dr1/survey/catalogs/dr1/mocks/EZmock/bright/v1/mock1'
          curl --http1.1 -fL --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 60 --max-time 900 -o mock_NGC.fits "$ROOT/BGS_ffa_NGC_clustering.dat.fits"
          curl --http1.1 -fL --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 60 --max-time 900 -o full.fits "$ROOT/ffa_full_BGS.fits"
          curl --http1.1 -fL --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 60 --max-time 120 -o listing.html "$ROOT/"
          echo '=== DIRECTORY FITS LINKS ==='
          grep -oE 'href="[^"]+\.fits"' listing.html | sed 's/^href="//;s/"$//' | sort -u || true
          python - <<'PY'
          from astropy.io import fits
          for fn in ['mock_NGC.fits','full.fits']:
              print('\n===',fn,'===')
              with fits.open(fn,memmap=True) as h:
                  print('HDU_COUNT',len(h))
                  for i,x in enumerate(h):
                      cols=list(getattr(getattr(x,'columns',None),'names',[]) or [])
                      print('HDU',i,'EXTNAME',x.header.get('EXTNAME'),'NROWS',len(x.data) if getattr(x,'data',None) is not None and hasattr(x.data,'__len__') else None)
                      print('COLUMNS',cols)
                      cand=[c for c in cols if any(k in c.upper() for k in ['MAG','FLUX','LUM','MASS','ABS','APP'])]
                      print('CANDIDATES',cand)
          PY
