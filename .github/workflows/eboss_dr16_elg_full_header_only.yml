name: eBOSS ELG full catalog FITS header-only synthetic test

on:
  push:
    branches:
      - audit/eboss-elg-bit8-ra-orientation-20260925
    paths:
      - 'scripts/audit_eboss_dr16_elg_full_header_only.py'
      - 'source_data/eboss_dr16_elg_full_header_only_protocol_2026-09-25.json'
      - '.github/workflows/eboss_dr16_elg_full_header_only.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-header-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic exact HTTP-block FITS header parser and no-row-access test
        run: python scripts/audit_eboss_dr16_elg_full_header_only.py --self-test
