name: eBOSS DR16 observed ELG extra-polygon random-only pilot

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_eboss_dr16_elg_extra_random_membership.py"
      - "source_data/eboss_dr16_elg_extra_random_membership_protocol_2026-09-25.json"
      - ".github/workflows/eboss_dr16_elg_extra_random_membership.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  synthetic-polygon-sampling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FITS and array dependencies for no-download test
        run: python -m pip install 'numpy>=1.24' 'astropy>=5.3' 'scipy>=1.10'
      - name: Test fixed source SHA, exact chunks and polygon membership algebra
        run: python scripts/audit_eboss_dr16_elg_extra_random_membership.py --self-test

  observed-sgc-polygon-pilot:
    needs: synthetic-polygon-sampling
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official MANGLE parser and FITS input libraries
        run: python -m pip install 'numpy>=1.24' 'astropy>=5.3' 'scipy>=1.10' pymangle
      - name: Retrieve fixed nine-mock random source and three extra polygon SHA manifest
        run: |
          gh run download 36017670812 --repo "$GITHUB_REPOSITORY" \
            --name eboss-dr16-nine-mock-window-ensemble --dir source
          gh run download 36100783598 --repo "$GITHUB_REPOSITORY" \
            --name eboss-dr16-elg-three-extra-polygon-sha --dir mask-source
          test -s source/ninemock_window_ensemble.json
          test -s mask-source/official_polygon_sha_manifest.json
      - name: Audit published SGC ELG clustering randoms only against three source polygons
        run: |
          python scripts/audit_eboss_dr16_elg_extra_random_membership.py \
            --ensemble-json source/ninemock_window_ensemble.json \
            --polygon-manifest mask-source/official_polygon_sha_manifest.json \
            --polygon-dir eboss_workspace/official_mask_inventory/official_polygons \
            --observed-cache-dir eboss_workspace/pub_randoms \
            --mock-ids none --caps SGC \
            --out-dir eboss_workspace/official_mask_inventory/membership \
            --timeout 120
      - name: Retain data-blind polygon-membership result or error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eboss-dr16-elg-extra-polygon-observed-sgc-pilot
          path: eboss_workspace/official_mask_inventory/membership/*.json
          if-no-files-found: warn
          retention-days: 90
