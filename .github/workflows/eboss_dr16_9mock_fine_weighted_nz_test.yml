name: eBOSS DR16 nine-mock local fine weighted n(z) synthetic gate

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_eboss_dr16_9mock_fine_weighted_nz.py'
      - '.github/workflows/eboss_dr16_9mock_fine_weighted_nz_test.yml'
      - 'source_data/eboss_dr16_9mock_fine_weighted_nz_protocol_2026-09-24.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  synthetic-weighted-nz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FITS and array dependencies for data-blind synthetic test
        run: python -m pip install 'numpy>=1.24' 'astropy>=5.3'
      - name: Test fixed 0.01-z and synthetic ELG-chunk FITS input gates
        run: python scripts/audit_eboss_dr16_9mock_fine_weighted_nz.py --self-test
      - name: Retrieve prevalidated nine-mock SHA manifest without galaxies
        run: |
          gh run download 36017670812 --repo "$GITHUB_REPOSITORY" \
            --name eboss-dr16-nine-mock-window-ensemble --dir source
          test -s source/ninemock_window_ensemble.json
      - name: Validate all 36 mock random and four observed random SHA pins
        run: |
          python scripts/audit_eboss_dr16_9mock_fine_weighted_nz.py \
            --ensemble-json source/ninemock_window_ensemble.json --preflight-only
