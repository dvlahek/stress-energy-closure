name: CLASS observational forecast

on:
  workflow_dispatch:
  push:
    branches:
      - class-observational-forecast
    paths:
      - 'code/class_observational_forecast.py'
      - 'observational_forecast/**'
      - '.github/workflows/class_observational_forecast.yml'

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manuscript repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip numpy matplotlib

      - name: Fetch pinned CLASS
        run: |
          git init class_public
          git -C class_public remote add origin https://github.com/lesgourg/class_public.git
          git -C class_public fetch --depth 1 origin e85808324f51fc694d12e3ed7439552a3c3f9540
          git -C class_public checkout --detach FETCH_HEAD
          test "$(git -C class_public rev-parse HEAD)" = "e85808324f51fc694d12e3ed7439552a3c3f9540"

      - name: Build CLASS
        run: make -C class_public class -j2

      - name: Run distortion sweep
        run: |
          set -euo pipefail
          for item in 005:0.05 010:0.10 020:0.20 030:0.30; do
            tag="${item%%:*}"
            frac="${item##*:}"
            out="observational_forecast_output/f${tag}_default"
            python code/class_observational_forecast.py --mode prepare --outdir "$out" --z-match 1100 --max-fractional-distortion "$frac"
            ./class_public/class "$out/class_plus.ini"
            ./class_public/class "$out/class_minus.ini"
            python code/class_observational_forecast.py --mode summarize --outdir "$out"
          done

      - name: Run high-precision 30-percent control
        run: |
          set -euo pipefail
          out="observational_forecast_output/f030_highprecision"
          python code/class_observational_forecast.py --mode prepare --outdir "$out" --z-match 1100 --max-fractional-distortion 0.30
          ./class_public/class "$out/class_plus.ini" observational_forecast/high_precision.pre
          ./class_public/class "$out/class_minus.ini" observational_forecast/high_precision.pre
          python code/class_observational_forecast.py --mode summarize --outdir "$out"

      - name: Aggregate validation summary
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          import numpy as np
          import pandas as pd

          root = Path('observational_forecast_output')
          rows=[]
          for d in sorted(root.iterdir()):
              if not d.is_dir() or not (d/'class_forecast_summary.json').exists():
                  continue
              s=json.loads((d/'class_forecast_summary.json').read_text())
              rows.append({
                  'run': d.name,
                  'max_fractional_distortion': s['max_fractional_distortion_plus'],
                  'moment_mismatch': s['max_relative_moment_mismatch'],
                  'max_abs_BB_relative_difference_percent': s['max_abs_BB_relative_difference_percent'],
                  'ell_at_max': s['ell_at_max_abs_BB_difference']
              })
          with (root/'validation_summary.csv').open('w', newline='') as f:
              w=csv.DictWriter(f, fieldnames=rows[0].keys())
              w.writeheader(); w.writerows(rows)

          d0=pd.read_csv(root/'f030_default/class_bmode_comparison.csv')
          dh=pd.read_csv(root/'f030_highprecision/class_bmode_comparison.csv')
          if not np.array_equal(d0['ell'].values, dh['ell'].values):
              raise RuntimeError('default/high-precision ell grids differ')
          x=d0['symmetric_relative_difference_percent'].values
          y=dh['symmetric_relative_difference_percent'].values
          max_shape=float(np.max(np.abs(x-y)))
          im=int(np.argmax(np.abs(y)))
          validation={
              'default_30_max_percent': float(np.max(np.abs(x))),
              'highprecision_30_max_percent': float(np.max(np.abs(y))),
              'highprecision_ell_at_max': int(dh['ell'].iloc[im]),
              'max_absolute_change_in_relative_difference_percentage_points': max_shape,
          }
          (root/'precision_validation.json').write_text(json.dumps(validation, indent=2)+'\n')
          print(json.dumps({'sweep':rows,'precision':validation}, indent=2))
          PY

      - name: Record solver commit
        if: always()
        run: git -C class_public rev-parse HEAD > observational_forecast_output/CLASS_COMMIT.txt

      - name: Upload reproducibility artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: class-observational-forecast
          path: observational_forecast_output/
          if-no-files-found: error
