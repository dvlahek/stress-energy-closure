name: K01D2-D1 pinpoint SWIFT qag failure

on:
  push:
    branches:
      - experiment/k01-matched-f-detectability-20261105
    paths:
      - "scripts/k01d2_d1_patch_swift_qag_diagnostic.py"
      - "source_data/k01d2_d1_pinpoint_swift_qag_failure_2026-11-06.json"
      - ".github/workflows/k01d2_d1_pinpoint_swift_qag.yml"
  pull_request:
    branches:
      - audit/eboss-elg-bit8-ra-orientation-20260925
    paths:
      - "scripts/k01d2_d1_patch_swift_qag_diagnostic.py"
      - "source_data/k01d2_d1_pinpoint_swift_qag_failure_2026-11-06.json"
      - ".github/workflows/k01d2_d1_pinpoint_swift_qag.yml"
  workflow_dispatch:

jobs:
  pinpoint:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout stress-energy-closure
        uses: actions/checkout@v4

      - name: Checkout pinned SWIFT
        uses: actions/checkout@v4
        with:
          repository: SWIFTSIM/SWIFT
          ref: e1a963fa682061498a5a59da1b3e1521e9eae724
          path: external/SWIFT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libhdf5-dev libfftw3-dev libgsl-dev libnuma-dev
          python -m pip install --upgrade pip numpy h5py

      - name: Apply diagnostic-only SWIFT patch
        run: python -u scripts/k01d2_d1_patch_swift_qag_diagnostic.py

      - name: Build instrumented pinned SWIFT
        run: |
          set -euo pipefail
          cd external/SWIFT
          ./autogen.sh
          ./configure --disable-mpi --disable-optimization --disable-doxygen-doc --disable-compiler-warnings --with-potential=constant
          make -j2
          git rev-parse HEAD

      - name: Prepare original physical Nnu1 calibration input
        run: python -u scripts/k01d1_swift_custom_f_transport_smoke.py prepare-calibration

      - name: Run until first qag failure
        run: |
          set +e
          cd k01d1_swift_work/calibration
          ../../external/SWIFT/swift -c -g --threads=2 calibration.yml 2>&1 | tee k01d2_d1.log
          code=${PIPESTATUS[0]}
          echo "SWIFT_EXIT_CODE=$code" | tee -a k01d2_d1.log
          if [ "$code" -ne 86 ]; then
            echo "Expected diagnostic exit 86, got $code"
            exit 1
          fi
          grep 'K01D2_QAG_FAIL' k01d2_d1.log

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k01d2-d1-pinpoint-qag-failure
          path: k01d1_swift_work/calibration/k01d2_d1.log
          if-no-files-found: warn
