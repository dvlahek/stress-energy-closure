name: eBOSS DR16 predeclared nine-mock random-only cross-LS algebra

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_eboss_dr16_random_only_cross_ls_pilot.py'
      - 'scripts/aggregate_eboss_dr16_random_only_cross_ls.py'
      - '.github/workflows/eboss_dr16_ninemock_random_only_cross_ls.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  synthetic-and-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthetic FITS, numerical and cosmology dependencies
        run: python -m pip install 'numpy>=1.24' 'scipy>=1.10' 'astropy>=5.3'
      - name: Test independent cross-pair orientation, published source-shard pins and complete-cohort aggregator
        run: |
          python scripts/audit_eboss_dr16_random_only_cross_ls_pilot.py --self-test
          python scripts/aggregate_eboss_dr16_random_only_cross_ls.py --self-test

  per-realization:
    needs: synthetic-and-source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mock_id: [1, 125, 250, 375, 500, 625, 750, 875, 1000]
    env:
      GH_TOKEN: ${{ github.token }}
      MOCK_ID: ${{ matrix.mock_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install random-only cross-LS numerical stack
        run: python -m pip install 'numpy>=1.24' 'scipy>=1.10' 'astropy>=5.3'
      - name: Download the same source-pinned nine-mock ensemble and individual mock random RR shard
        run: |
          gh run download 36017670812 --repo "$GITHUB_REPOSITORY" \
            --name eboss-dr16-nine-mock-window-ensemble --dir source
          gh run download 36015246541 --repo "$GITHUB_REPOSITORY" \
            --name "eboss-ninemock-window-id${MOCK_ID}" --dir prior_shard
          test -s source/ninemock_window_ensemble.json
          test -s prior_shard/NGC.json
          test -s prior_shard/SGC.json
      - name: Verify all four random-source SHA pins per cap and count four oriented split-random cross-LS terms
        run: |
          for CAP in NGC SGC; do
            mkdir -p "results/$CAP"
            python scripts/audit_eboss_dr16_random_only_cross_ls_pilot.py \
              --ensemble-json source/ninemock_window_ensemble.json \
              --mock-shard-dir prior_shard \
              --mock-id "$MOCK_ID" --cap "$CAP" \
              --fine-checkpoint-dir eboss_workspace/no_local_fine_checkpoint \
              --observed-cache-dir eboss_workspace/verified_obs \
              --mock-cache-dir eboss_workspace/verified_mocks \
              --out-dir "results/$CAP" --timeout 125
          done
      - name: Preserve exact-cap output and partial error evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eboss-dr16-random-only-cross-ls-id${{ matrix.mock_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    needs: per-realization
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install array and FITS dependencies for input provenance
        run: python -m pip install 'numpy>=1.24' 'scipy>=1.10' 'astropy>=5.3'
      - name: Retrieve the exact parent cohort and all nine completed per-realization artifacts
        run: |
          gh run download 36017670812 --repo "$GITHUB_REPOSITORY" \
            --name eboss-dr16-nine-mock-window-ensemble --dir source
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'eboss-dr16-random-only-cross-ls-id*' --dir cohort
      - name: Reject absent or duplicated mock/cap cases and independently verify source identity and parity
        run: |
          python scripts/aggregate_eboss_dr16_random_only_cross_ls.py \
            --input-dir cohort \
            --ensemble-json source/ninemock_window_ensemble.json \
            --out results/ninemock_random_only_cross_ls_aggregate.json
      - name: Retain descriptive random-only estimator algebra result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eboss-dr16-nine-mock-cross-ls-algebra-aggregate
          path: results/ninemock_random_only_cross_ls_aggregate.json
          if-no-files-found: warn
          retention-days: 90
