name: Planck 2018 real-data hidden-mode fit

on:
  workflow_dispatch:
  push:
    branches:
      - scalar-lensing-screen
    paths:
      - '.github/workflows/planck_realdata_hidden_mode_fit.yml'

permissions:
  contents: read
  actions: read

env:
  SOURCE_SPECTRA_RUN_ID: '34677322082'
  PLANCK_LITE_COMMIT: '2c0d0f67e59ce781654cf62dd7fb10757b0e60be'

jobs:
  fit:
    name: blind Plik-lite TTTEEE hidden-mode profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install --upgrade pip numpy scipy

      - name: Download frozen high-precision CLASS spectra
        uses: actions/download-artifact@v4
        with:
          pattern: cmb-survey-spectrum-*
          path: spectra
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: dvlahek/stress-energy-closure
          run-id: ${{ env.SOURCE_SPECTRA_RUN_ID }}

      - name: Fetch pinned public Planck Plik-lite implementation and data
        run: |
          set -euo pipefail
          git clone https://github.com/heatherprince/planck-lite-py.git planck-lite-py
          git -C planck-lite-py checkout --detach "$PLANCK_LITE_COMMIT"
          test "$(git -C planck-lite-py rev-parse HEAD)" = "$PLANCK_LITE_COMMIT"

      - name: Validate Planck 2018 Plik-lite implementation
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          import numpy as np
          sys.path.insert(0, 'planck-lite-py')
          from planck_lite_py import PlanckLitePy
          like = PlanckLitePy(data_directory='planck-lite-py/data', year=2018,
                              spectra='TTTEEE', use_low_ell_bins=False)
          ell, dtt, dte, dee = np.genfromtxt(
              'planck-lite-py/data/Dl_planck2015fit.dat', unpack=True)
          got = like.loglike(dtt, dte, dee, int(ell[0]))
          expected = -291.33481235418026
          print({'plik_lite_validation_loglike': got, 'expected': expected,
                 'difference': got-expected})
          if abs(got - expected) > 1e-8:
              raise SystemExit('Planck Plik-lite validation failed')
          PY

      - name: Fit the pre-defined hidden mode to actual Planck data
        run: |
          set -euo pipefail
          python code/planck_realdata_hidden_mode_fit.py \
            --spectra-root spectra \
            --planck-lite-root planck-lite-py \
            --outdir planck_realdata_fit

      - name: Sanity-check blind fit output
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math
          from pathlib import Path
          p=Path('planck_realdata_fit/planck2018_hidden_mode_fit.json')
          x=json.loads(p.read_text())
          f=x['formal_unconstrained_linear_template_fit']
          assert math.isfinite(float(f['alpha_hat']))
          assert math.isfinite(float(f['sigma_alpha'])) and float(f['sigma_alpha']) > 0
          assert x['pre_registered_hidden_template']['no_data_driven_mass_or_direction_optimization'] is True
          assert int(x['data_selection']['retained_bins']['TE']) == int(x['data_selection']['official_full_bins']['TE'])
          assert int(x['data_selection']['retained_bins']['EE']) == int(x['data_selection']['official_full_bins']['EE'])
          print(json.dumps({
              'alpha_hat': f['alpha_hat'],
              'sigma_alpha': f['sigma_alpha'],
              'alpha_over_sigma': f['alpha_over_sigma'],
              'delta_chi2_alpha0': f['delta_chi2_alpha0'],
              'retained_bins': x['data_selection']['retained_bins'],
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: planck2018-realdata-hidden-mode-fit
          path: planck_realdata_fit/
          if-no-files-found: error
