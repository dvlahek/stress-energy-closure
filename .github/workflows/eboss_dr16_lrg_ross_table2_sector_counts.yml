name: eBOSS LRG Ross Table 2 source-informed count replay synthetic gate

on:
  push:
    branches:
      - audit/eboss-elg-bit8-ra-orientation-20260925
    paths:
      - 'scripts/audit_eboss_dr16_lrg_ross_table2_sector_counts.py'
      - 'source_data/eboss_dr16_lrg_ross_table2_sector_replay_protocol_2026-09-25.json'
      - '.github/workflows/eboss_dr16_lrg_ross_table2_sector_counts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-no-real-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy for no-real-data synthetic gate
        run: python -m pip install 'numpy>=1.24,<2.4'
      - name: Check exact sequential cuts on synthetic fields only
        run: python -u scripts/audit_eboss_dr16_lrg_ross_table2_sector_counts.py --self-test
