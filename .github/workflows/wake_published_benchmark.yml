name: Validation - published wake benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'code/wake_published_benchmark.py'
      - 'code/wake_desi_multitracer_fisher.py'
      - 'code/wake_desi_multitracer_fullgrid.py'
      - '.github/workflows/wake_published_benchmark.yml'

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip setuptools wheel numpy scipy cython
      - name: Fetch pinned CLASS
        run: |
          git init class_public
          git -C class_public remote add origin https://github.com/lesgourg/class_public.git
          git -C class_public fetch --depth 1 origin e85808324f51fc694d12e3ed7439552a3c3f9540
          git -C class_public checkout --detach FETCH_HEAD
          test "$(git -C class_public rev-parse HEAD)" = "e85808324f51fc694d12e3ed7439552a3c3f9540"
      - name: Install CLASS
        run: python -m pip install ./class_public
      - name: Run external benchmark table
        run: python code/wake_published_benchmark.py --outdir wake_published_benchmark --mass 0.06
      - name: Record CLASS commit
        run: git -C class_public rev-parse HEAD > wake_published_benchmark/CLASS_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wake-published-benchmark
          path: wake_published_benchmark/
          if-no-files-found: error
