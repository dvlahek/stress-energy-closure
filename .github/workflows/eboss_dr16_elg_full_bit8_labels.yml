name: eBOSS DR16 official ELG bit8 catalogue-label synthetic gate

on:
  push:
    branches:
      - audit/eboss-elg-bit8-ra-orientation-20260925
    paths:
      - 'scripts/audit_eboss_dr16_elg_full_bit8_labels.py'
      - 'source_data/eboss_dr16_elg_full_bit8_label_protocol_2026-09-25.json'
      - '.github/workflows/eboss_dr16_elg_full_bit8_labels.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-no-observed-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HEALPix + NumPy for frozen synthetic comparison only
        run: python -m pip install 'numpy>=1.24' 'healpy>=1.17,<1.21'
      - name: Check exact three-field FITS byte-stride extraction and native RA on synthetic rows
        run: python -u scripts/audit_eboss_dr16_elg_full_bit8_labels.py --self-test
