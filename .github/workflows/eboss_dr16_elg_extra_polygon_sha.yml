name: eBOSS DR16 three official ELG extra-veto polygons

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_eboss_dr16_official_polygon_sha.py"
      - ".github/workflows/eboss_dr16_elg_extra_polygon_sha.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pin-elg-extra-polygons:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit official source URL and SHA synthetic gate
        run: python scripts/audit_eboss_dr16_official_polygon_sha.py --self-test
      - name: Retrieve previously validated official DR16 index
        run: |
          gh run download 36099075387 --repo "$GITHUB_REPOSITORY" \
            --name eboss-dr16-official-mask-source-index --dir input
          test -s input/official_mask_index.json
      - name: Pin only official three ELG extra polygon bytes, no LRG allsky transfer
        run: |
          python scripts/audit_eboss_dr16_official_polygon_sha.py \
            --inventory-json input/official_mask_index.json \
            --out-dir eboss_workspace/official_mask_inventory \
            --only-elg-extra --timeout 100
      - name: Preserve complete or partial provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eboss-dr16-elg-three-extra-polygon-sha
          path: |
            eboss_workspace/official_mask_inventory/official_polygon_sha_manifest.json
            eboss_workspace/official_mask_inventory/official_polygons/ELG_centerpost.ply
            eboss_workspace/official_mask_inventory/official_polygons/ELG_TDSSFES_62arcsec.pix.snap.balk.ply
            eboss_workspace/official_mask_inventory/official_polygons/ebosselg_badphot.26Aug2019.ply
          if-no-files-found: warn
          retention-days: 90
