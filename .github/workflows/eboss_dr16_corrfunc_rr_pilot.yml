name: eBOSS DR16 compiled random-only RR pilot

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_eboss_dr16_corrfunc_rr_pilot.py'
      - '.github/workflows/eboss_dr16_corrfunc_rr_pilot.yml'
  workflow_dispatch:

jobs:
  rr-corrfunc-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned DESI-compatible pycorr and Corrfunc backend
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-desi.txt
      - name: Independently check compiled and scalar weighted RR
        run: python scripts/audit_eboss_dr16_corrfunc_rr_pilot.py --self-test
      - name: Audit fixed high-z RR density and distance variants from randoms only
        run: |
          python scripts/audit_eboss_dr16_corrfunc_rr_pilot.py \
            --threads 2 \
            --out eboss_workspace/eboss_corrfunc_rr_pilot.json
      - name: Retain random-only RR pilot and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eboss-dr16-compiled-rr-pilot
          path: eboss_workspace/eboss_corrfunc_rr_pilot.json
          if-no-files-found: warn
