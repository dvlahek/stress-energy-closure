name: eBOSS DR16 matched EZmock0001 galaxy cross-LS SHA and synthetic gate

on:
  push:
    branches:
      - audit/eboss-elg-bit8-ra-orientation-20260925
    paths:
      - 'scripts/audit_eboss_dr16_ezmock0001_galaxy_cross_ls_pilot.py'
      - 'source_data/eboss_dr16_ezmock0001_galaxy_raw_sha_uploaded_manifest_2026-09-26.json'
      - 'source_data/eboss_dr16_ezmock0001_galaxy_cross_ls_pilot_protocol_2026-09-26.json'
      - '.github/workflows/eboss_dr16_ezmock0001_galaxy_cross_ls_pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-and-source-report-only-no-FITS-or-odd-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy astropy scipy for independent synthetic cross-estimator
        run: python -m pip install 'numpy>=1.24,<2.4' 'astropy>=6,<8' 'scipy>=1.11,<2'
      - name: Compile exact-SHA matched mock galaxy estimator runner
        run: python -m py_compile scripts/audit_eboss_dr16_ezmock0001_galaxy_cross_ls_pilot.py
      - name: Verify archived uploaded four-source SHA manifest and independent scalar synthetic estimator
        run: python -u scripts/audit_eboss_dr16_ezmock0001_galaxy_cross_ls_pilot.py --self-test
