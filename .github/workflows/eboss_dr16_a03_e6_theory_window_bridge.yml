name: eBOSS DR16 A-03E6 physics-first SOURCE-ONLY synthetic theory RR bridge

on:
  push:
    branches:
      - audit/eboss-elg-bit8-ra-orientation-20260925
    paths:
      - 'scripts/audit_eboss_dr16_a03_e6_theory_window_bridge.py'
      - 'source_data/eboss_dr16_a03_e6_physical_template_to_empirical_window_bridge_protocol_2026-09-27.json'
      - '.github/workflows/eboss_dr16_a03_e6_theory_window_bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-theory-operator-and-budget-stop-no-FITS:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependency used by original eBOSS conditional operator
        run: python -m pip install 'numpy>=1.24,<2.4'
      - name: Compile original eBOSS conditional operator and E6 source-only auditor
        run: |
          python -m py_compile scripts/build_eboss_dr16_conditional_window.py
          python -m py_compile scripts/audit_eboss_dr16_a03_e6_theory_window_bridge.py
      - name: Validate 20 synthetic conditional RR blocks, full 24D pilot, even/odd leakage and algebraic bias STOP
        run: python -u scripts/audit_eboss_dr16_a03_e6_theory_window_bridge.py --self-test
