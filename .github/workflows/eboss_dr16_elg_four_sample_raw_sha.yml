name: eBOSS DR16 four preselected ELG gzip FITS source-byte gate (synthetic)

on:
  push:
    branches:
      - audit/eboss-elg-bit8-ra-orientation-20260925
    paths:
      - 'scripts/audit_eboss_dr16_elg_four_sample_raw_sha.py'
      - 'source_data/eboss_dr16_elg_maskbit_four_sample_raw_sha_protocol_2026-09-26.json'
      - '.github/workflows/eboss_dr16_elg_four_sample_raw_sha.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-no-remote-image-or-observed-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile standalone raw-only downloader
        run: python -m py_compile scripts/audit_eboss_dr16_elg_four_sample_raw_sha.py
      - name: Verify exact four preselected filenames and synthetic gzip stream corruption fail-closed
        run: python -u scripts/audit_eboss_dr16_elg_four_sample_raw_sha.py --self-test
