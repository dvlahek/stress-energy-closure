name: eBOSS DR16 ELG bit8 RA-orientation source-only follow-up

on:
  push:
    branches:
      - audit/eboss-elg-bit8-ra-orientation-20260925
    paths:
      - 'scripts/audit_eboss_dr16_elg_bit8_ra_orientation.py'
      - 'source_data/eboss_dr16_elg_bit8_ra_orientation_protocol_2026-09-25.json'
      - 'scripts/audit_eboss_dr16_elg_bit8_coordinate_contract.py'
      - 'scripts/eBOSS_ELG_extra.py'
      - '.github/workflows/eboss_dr16_elg_bit8_ra_orientation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-vs-reflected-ra-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical spherical-geometry dependencies only
        run: python -m pip install 'numpy>=1.24' 'healpy>=1.17,<1.21'
      - name: Native RA and reflected RA synthetic self-test
        run: python scripts/audit_eboss_dr16_elg_bit8_ra_orientation.py --self-test
      - name: Audit all 37 published source pixel centres without catalogue access
        run: |
          python scripts/audit_eboss_dr16_elg_bit8_ra_orientation.py \
            --out reports/eboss_dr16_elg_bit8_ra_orientation_followup.json
      - name: Preserve source-only geometric report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eboss-dr16-elg-bit8-ra-orientation-source-only
          path: reports/eboss_dr16_elg_bit8_ra_orientation_followup.json
          if-no-files-found: warn
          retention-days: 90
