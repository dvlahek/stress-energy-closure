name: eBOSS DR16 A03E8b frozen static halo SI Green kernel
on:
  push:
    branches:
      - audit/eboss-elg-bit8-ra-orientation-20260925
    paths:
      - 'scripts/build_eboss_dr16_a03_e8b_conditional_static_halo_green_kernel.py'
      - 'source_data/eboss_dr16_a03_e8b_static_halo_green_kernel_protocol_2026-09-27.json'
      - '.github/workflows/eboss_dr16_a03_e8b_static_halo_SI_kernel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-halo-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<2.4'
      - name: SHA-fixed source, signed velocity, physical k, SI Green factor, no galaxy xi
        run: |
          python -m py_compile scripts/build_eboss_dr16_a03_e8b_conditional_static_halo_green_kernel.py
          python -u scripts/build_eboss_dr16_a03_e8b_conditional_static_halo_green_kernel.py --self-test
      - name: Generate frozen nine illustrative SI conditional kernel coefficients
        run: python -u scripts/build_eboss_dr16_a03_e8b_conditional_static_halo_green_kernel.py
      - uses: actions/upload-artifact@v4
        with:
          name: eboss-a03-e8b-frozen-conditional-static-halo-SI-kernel
          if-no-files-found: error
          retention-days: 30
          path: eboss_workspace/a03_physics_source/e8_frozen_kinetic_resonance/conditional_static_halo_green_kernel.json
