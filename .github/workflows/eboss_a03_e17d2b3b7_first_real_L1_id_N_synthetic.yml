name: eBOSS A03 E17D2b3b7 locked two-column source-only and synthetic gate
on:
  push:
    branches:
      - audit/eboss-elg-bit8-ra-orientation-20260925
    paths:
      - 'source_data/eboss_dr16_a03_e17d2b3b7_*'
      - 'scripts/audit_eboss_dr16_a03_e17d2b3b7_first_real_L1_id_N.py'
      - '.github/workflows/eboss_a03_e17d2b3b7_first_real_L1_id_N_synthetic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prereg-and-synthetic-only-no-real-ASDF:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout audit branch no real halo data
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm original prospective B7 protocol and parent blobs
        run: |
          set -euo pipefail
          test "$(git hash-object source_data/eboss_dr16_a03_e17d2b3b7_first_real_L1_id_N_columns_prereg_2026-09-29.json)" = 296bc22e3d38a414017cc018e1f8ba8658899278
          test "$(git hash-object source_data/eboss_dr16_a03_e17d2b3b6_user_reported_real_ASDF_YAML_schema_local_acceptance_2026-09-29.json)" = 570366acf3c9db90a3d7542b2ce80bc21195a6ba
          test "$(git hash-object scripts/audit_eboss_dr16_a03_e17d2b3b6_bounded_real_ASDF_YAML_schema_metadata.py)" = 718d2dde75f29dfbf2e32ab54cb624fc2a6688f8
          echo E17D2B3B7_PROSPECTIVE_GIT_PINS_PASS
      - name: Install only synthetic test dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'numpy==2.2.6'
      - name: Validate source syntax and execute synthetic-only 8 negatives
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/audit_eboss_dr16_a03_e17d2b3b7_first_real_L1_id_N.py
          python3 -u scripts/audit_eboss_dr16_a03_e17d2b3b7_first_real_L1_id_N.py --self-test
          echo E17D2B3B7_CI_SOURCE_ONLY_SYNTHETIC_PASS_NO_ACTUAL_HALO_VALUES
