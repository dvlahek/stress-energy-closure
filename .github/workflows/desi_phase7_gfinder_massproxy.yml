name: Phase 7 - Gfinder five-tracer halo-mass proxy

on:
  workflow_dispatch:
  push:
    branches: [phase7-nature-astronomy]
    paths:
      - 'code/desi_phase7_gfinder_massproxy.py'
      - '.github/workflows/desi_phase7_gfinder_massproxy.yml'

jobs:
  gfinder-massproxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip setuptools wheel numpy scipy astropy cython desitarget
      - name: Fetch pinned CLASS
        run: |
          git init class_public
          git -C class_public remote add origin https://github.com/lesgourg/class_public.git
          git -C class_public fetch --depth 1 origin e85808324f51fc694d12e3ed7439552a3c3f9540
          git -C class_public checkout --detach FETCH_HEAD
          python -m pip install ./class_public
      - name: Build fixed Phase-7 templates
        run: python code/wake_phase7_template.py --outdir phase7_template --mass 0.06 --z-match 1100 --frac 0.30 --s-min 20 --s-max 140 --s-step 2
      - name: Download DESI BGS and Gfinder catalogs
        shell: bash
        run: |
          set -euo pipefail
          PIC='https://webdav-hdfs.pic.es/data/public/DESI/DR1'
          PRIMARY='https://data.desi.lbl.gov/public/dr1'
          fetch_one () {
            rel="$1"; out="$2"; rm -f "$out"
            echo "DOWNLOAD $rel"
            if ! curl -k -fL --retry 4 --retry-all-errors --retry-delay 5 \
                --connect-timeout 20 --max-time 3600 -o "$out" "$PIC/$rel"; then
              echo "PIC mirror unavailable; trying DESI primary"
              rm -f "$out"
              curl -fL --retry 4 --retry-all-errors --retry-delay 5 \
                --connect-timeout 30 --max-time 3600 -o "$out" "$PRIMARY/$rel"
            fi
            test -s "$out"
            ls -lh "$out"
          }
          ROOT='survey/catalogs/dr1/LSS/iron/LSScats/v1.5'
          fetch_one "$ROOT/BGS_BRIGHT-21.5_NGC_clustering.dat.fits" BGS_NGC.dat.fits
          fetch_one "$ROOT/BGS_BRIGHT-21.5_SGC_clustering.dat.fits" BGS_SGC.dat.fits
          fetch_one "$ROOT/BGS_BRIGHT-21.5_NGC_0_clustering.ran.fits" BGS_NGC.ran.fits
          fetch_one "$ROOT/BGS_BRIGHT-21.5_SGC_0_clustering.ran.fits" BGS_SGC.ran.fits
          GROOT='vac/dr1/gfinder/v1.0'
          fetch_one "$GROOT/DESIDR9.y1.v1_galaxy.fits" gfinder_galaxy.fits
          fetch_one "$GROOT/iDESIDR9.y1.v1_1.fits" gfinder_relation.fits
          fetch_one "$GROOT/DESIDR9.y1.v1_group.fits" gfinder_group.fits
      - name: Validate downloaded FITS
        run: |
          python - <<'PY'
          from astropy.io import fits
          from pathlib import Path
          files=[Path('BGS_NGC.dat.fits'),Path('BGS_SGC.dat.fits'),Path('BGS_NGC.ran.fits'),Path('BGS_SGC.ran.fits'),Path('gfinder_galaxy.fits'),Path('gfinder_relation.fits'),Path('gfinder_group.fits')]
          for p in files:
              with fits.open(p,memmap=True) as h:
                  h.verify('exception')
                  if len(h)<2 or h[1].data is None or len(h[1].data)==0:
                      raise RuntimeError(f'invalid FITS: {p}')
                  print('FITS_OK',p,len(h[1].data),list(h[1].columns.names)[:12])
          PY
      - name: Run fixed Gfinder mass-proxy analysis
        run: |
          python code/desi_phase7_gfinder_massproxy.py \
            --data BGS_NGC.dat.fits BGS_SGC.dat.fits \
            --random BGS_NGC.ran.fits BGS_SGC.ran.fits \
            --gfinder-galaxy gfinder_galaxy.fits \
            --gfinder-relation gfinder_relation.fits \
            --gfinder-group gfinder_group.fits \
            --templates phase7_template/phase7_templates.csv \
            --outdir phase7_gfinder_massproxy \
            --zmin 0.10 --zmax 0.40 --dz-proxy 0.02 --ntracer 5 \
            --analysis-z-edges 0.10,0.20,0.30,0.40 \
            --sep-edges 20,40,60,80,100,120,140 \
            --random-factor 2.0 --neighbors-per-anchor 48 \
            --theta-min-deg 0.05 --jackknife 30 --permutations 32 --seed 20260913
      - name: Record provenance
        run: |
          git rev-parse HEAD > phase7_gfinder_massproxy/REPOSITORY_COMMIT.txt
          git -C class_public rev-parse HEAD > phase7_gfinder_massproxy/CLASS_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phase7-gfinder-five-tracer-massproxy
          path: phase7_gfinder_massproxy/
          if-no-files-found: error
