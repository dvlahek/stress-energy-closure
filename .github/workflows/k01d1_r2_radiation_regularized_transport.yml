name: K01D1-R2 radiation-regularized SWIFT transport

on:
  push:
    branches:
      - experiment/k01-matched-f-detectability-20261105
    paths:
      - "scripts/k01d1_r2_radiation_regularized_transport.py"
      - "source_data/k01d1_r2_radiation_regularized_transport_prereg_2026-11-06.json"
      - ".github/workflows/k01d1_r2_radiation_regularized_transport.yml"
  pull_request:
    branches:
      - audit/eboss-elg-bit8-ra-orientation-20260925
    paths:
      - "scripts/k01d1_r2_radiation_regularized_transport.py"
      - "source_data/k01d1_r2_radiation_regularized_transport_prereg_2026-11-06.json"
      - ".github/workflows/k01d1_r2_radiation_regularized_transport.yml"
  workflow_dispatch:

jobs:
  transport:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout stress-energy-closure
        uses: actions/checkout@v4

      - name: Checkout pinned SWIFT
        uses: actions/checkout@v4
        with:
          repository: SWIFTSIM/SWIFT
          ref: e1a963fa682061498a5a59da1b3e1521e9eae724
          path: external/SWIFT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libhdf5-dev libfftw3-dev libgsl-dev libnuma-dev
          python -m pip install --upgrade pip numpy h5py

      - name: Build pinned SWIFT
        run: |
          set -euo pipefail
          cd external/SWIFT
          ./autogen.sh
          ./configure --disable-mpi --disable-optimization --disable-doxygen-doc --disable-compiler-warnings --with-potential=constant
          make -j2
          git rev-parse HEAD

      - name: Prepare R2 matched custom-F ICs
        run: python -u scripts/k01d1_r2_radiation_regularized_transport.py prepare

      - name: Run three R2 SWIFT transport jobs
        run: |
          set -euo pipefail
          for state in FD Fplus Fminus; do
            echo "=== K01D1-R2 SWIFT STATE $state ==="
            (
              cd "k01d1_r2_swift_work/$state"
              ../../external/SWIFT/swift -c -g --threads=2 science.yml 2>&1 | tee swift.log
            )
          done

      - name: Analyze preregistered R2 gates
        run: python -u scripts/k01d1_r2_radiation_regularized_transport.py analyze

      - name: Show result and logs
        if: always()
        run: |
          if [ -f k01d1_r2_transport_result.json ]; then
            cat k01d1_r2_transport_result.json
          fi
          for state in FD Fplus Fminus; do
            echo "=== $state tail ==="
            tail -100 "k01d1_r2_swift_work/$state/swift.log" 2>/dev/null || true
          done

      - name: Upload K01D1-R2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k01d1-r2-swift-transport
          path: |
            k01d1_r2_transport_result.json
            k01d1_r2_swift_work/input_summary.json
            k01d1_r2_swift_work/FD/swift.log
            k01d1_r2_swift_work/Fplus/swift.log
            k01d1_r2_swift_work/Fminus/swift.log
          if-no-files-found: warn
