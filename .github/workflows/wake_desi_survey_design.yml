name: DESI BGS wake survey design map

on:
  push:
    branches: [fullshape-wake-upgrade]
    paths:
      - 'code/wake_desi_survey_design.py'
      - '.github/workflows/wake_desi_survey_design.yml'
  workflow_dispatch:

jobs:
  design:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip setuptools wheel numpy scipy cython
      - name: Fetch pinned CLASS
        run: |
          git init class_public
          git -C class_public remote add origin https://github.com/lesgourg/class_public.git
          git -C class_public fetch --depth 1 origin e85808324f51fc694d12e3ed7439552a3c3f9540
          git -C class_public checkout --detach FETCH_HEAD
          test "$(git -C class_public rev-parse HEAD)" = "e85808324f51fc694d12e3ed7439552a3c3f9540"
      - name: Install CLASS
        run: python -m pip install ./class_public
      - name: Run survey design map
        run: python code/wake_desi_survey_design.py
      - name: Record CLASS commit
        run: git -C class_public rev-parse HEAD > wake_survey_design_output/CLASS_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wake-survey-design
          path: wake_survey_design_output/
          if-no-files-found: error
