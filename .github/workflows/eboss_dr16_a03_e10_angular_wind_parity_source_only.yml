name: eBOSS DR16 A03E10 wind-parity conditional Fourier odd source only
on:
  push:
    branches:
      - audit/eboss-elg-bit8-ra-orientation-20260925
    paths:
      - 'scripts/audit_eboss_dr16_a03_e10_angular_wind_parity_bridge.py'
      - 'source_data/eboss_dr16_a03_e10_wind_parity_angular_odd_bridge_protocol_2026-09-27.json'
      - '.github/workflows/eboss_dr16_a03_e10_angular_wind_parity_source_only.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-frozen-E8-E9-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<2.4'
      - name: Reuse original PASS E8 CSV artifact bit-for-bit, no environment-dependent reconstruction
        run: |
          mkdir -p eboss_workspace/a03_e10_original_E8
          gh run download 36307484339 --repo dvlahek/stress-energy-closure --name eboss-a03-e8-frozen-source-only-kinetic-and-conditional-resonance --dir eboss_workspace/a03_e10_original_E8
          test -s eboss_workspace/a03_e10_original_E8/frozen_matched_distributions_4000q.csv
          echo 'bf8f48deb9514c5101d5ce314bfbd397485102a5487da1039f141e3cad6143d0  eboss_workspace/a03_e10_original_E8/frozen_matched_distributions_4000q.csv' | sha256sum --check
      - name: Retrieve existing completed frozen CLASS E9 output only; no new catalogue/mock or CLASS run
        run: |
          mkdir -p eboss_workspace/a03_e10_original_E9
          gh run download 36325438404 --repo dvlahek/stress-energy-closure --name eboss-a03-e9-frozen-three-state-class-conditional-phase --dir eboss_workspace/a03_e10_original_E9
          test -s eboss_workspace/a03_e10_original_E9/quasistatic_alpha_dln_a_source_only_plus_CLASS.json
          sha256sum eboss_workspace/a03_e10_original_E9/quasistatic_alpha_dln_a_source_only_plus_CLASS.json
      - name: Exact source-SHA and 256/512 angular EqA8 positive-v versus negative-v ensemble parity audit
        run: |
          python -m py_compile scripts/audit_eboss_dr16_a03_e10_angular_wind_parity_bridge.py
          python -u scripts/audit_eboss_dr16_a03_e10_angular_wind_parity_bridge.py \
            --e8-csv eboss_workspace/a03_e10_original_E8/frozen_matched_distributions_4000q.csv \
            --e9-json eboss_workspace/a03_e10_original_E9/quasistatic_alpha_dln_a_source_only_plus_CLASS.json \
            --output eboss_workspace/a03_e10_angular_parity_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: eboss-a03-e10-original-E8-E9-conditional-odd-wind-parity
          if-no-files-found: error
          retention-days: 30
          path: eboss_workspace/a03_e10_angular_parity_report.json
