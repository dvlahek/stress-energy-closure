name: eBOSS DR16 fixed EZmock0001 galaxy DATA source-byte gate

on:
  push:
    branches:
      - audit/eboss-elg-bit8-ra-orientation-20260925
    paths:
      - 'scripts/audit_eboss_dr16_ezmock0001_galaxy_raw_sha.py'
      - 'source_data/eboss_dr16_ezmock0001_galaxy_raw_bytes_protocol_2026-09-26.json'
      - '.github/workflows/eboss_dr16_ezmock0001_galaxy_raw_sha.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-and-synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile raw-only mock galaxy audit
        run: python -m py_compile scripts/audit_eboss_dr16_ezmock0001_galaxy_raw_sha.py
      - name: Check fixed prior cohort and artificial gzip source transfer corruption
        run: python -u scripts/audit_eboss_dr16_ezmock0001_galaxy_raw_sha.py --self-test
